<style>

  *{box-sizing:border-box}

    font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

<script id="docs-json" type="application/json">[{"id": "prd", "title": "Product Requirements (PRD)", "group": "Product", "md": "# PRD — Vedrix\n\n**Version:** 1.0 · **Date:** 2026-07-03 · **Owner:** Adithya · **Status:** Draft for review\n**Current shipped version:** v0.4 (macOS, unsigned, personal use)\n\n---\n\n## 1. Product summary\n\nA **local-first, instant document reader** that opens Markdown, PDF, Word, PowerPoint, Excel, and plain text in one fast, beautiful, tabbed window — with topic sidebars for every format, reader-grade themes, and (coming) light editing, cross-format export, mind maps, and an AI reading companion. Ships on **macOS, Windows, Android, iOS** from one Tauri 2 codebase.\n\n**Positioning in one line:** *\"Every document your day throws at you, opened in under a second, readable like a book — no accounts, no cloud, no subscription.\"*\n\n**Reference competitors:** Obsidian (heavier, edit-first, md-only), Marked 2 (md-only, macOS-only), Preview/Adobe (PDF-only, no reading experience), NotebookLM (cloud, AI-first, no local files). None combine *multi-format + local-first + reading-first + cross-platform*.\n\n---\n\n## 2. Problem statement\n\nKnowledge workers receive documents in 6+ formats daily, and each format opens in a different heavyweight app with a different UI — Word takes seconds to launch to read a two-page memo, PDFs open in browsers without navigation aids, and Markdown opens as raw text. There is no single lightweight tool that treats *reading* documents as the primary job. The cost: constant context-switching, lost reading positions, no way to see a document's structure at a glance, and documents that are effectively unreadable on the machine they live on.\n\nEvidence (founder-as-user): daily workflow spans md project references (100+ headings), design-tool PDFs, pptx decks, docx proposals, and mixed Devanagari/English documents — previously requiring 5 different apps.\n\n## 3. Goals\n\n**User goals**\n1. **Instant reading:** any supported file opens and paints in < 1s (md/text) / < 3s (typical PDF) on a 2020+ machine.\n2. **Never lose your place:** sessions, tabs, and reading positions survive restarts, 100% of the time.\n3. **Structure at a glance:** ≥ 90% of text-based documents produce a meaningful topic sidebar (not page numbers).\n4. **One tool, five platforms:** identical core experience on macOS, Windows, Android, iOS.\n\n**Business goals**\n5. **v1.0 public release** (signed macOS + Windows) within 6 weeks of PRD approval.\n6. **1,000 downloads in the first 90 days** post-public-launch; **4.5★+ average** store rating.\n7. **Pro conversion ≥ 4%** of monthly active users within 6 months of Pro launch (one-time unlock, benchmark: indie utility apps 2–5%).\n\n## 4. Non-goals\n\n- **Full editor / IDE ambitions** — editing ships as a lightweight ⌘E mode for md/text only; we will not build WYSIWYG, plugins-for-editing, or compete with Obsidian on authoring. *(Why: reading-first identity is the differentiator.)*\n- **Cloud sync, accounts, collaboration** — local-first is the product. *(Why: trust + zero infra cost + differentiation.)*\n- **Editing PDF/DOCX/PPTX content** — view/convert only. *(Why: different product, enormous scope.)*\n- **Plugin ecosystem in v1–v2** — revisit after the reading core plateaus. *(Why: premature platform-building.)*\n- **Linux as a launch target** — Tauri supports it; we defer QA/packaging until demand shows. *(Why: focus.)*\n\n## 5. Personas & user stories\n\n**P1 — \"The Builder\" (primary; founder archetype):** developer/founder juggling specs, decks, and PDFs across projects.\n- As a builder, I want every project doc to open in the same tabbed window so that reading a spec doesn't mean launching three apps.\n- As a builder, I want ⌘F search inside any document (including PDFs) so that I can find \"hash chain\" without re-reading 20 pages.\n- As a builder, I want to edit a typo in a markdown doc with ⌘E so that small fixes don't require opening an editor.\n- As a builder, I want any document as a mind map so that I can grasp/present its structure in seconds.\n\n**P2 — \"The Researcher/Student\":** reads long PDFs and scanned papers, takes notes elsewhere.\n- As a researcher, I want PDF reading mode (PDF→MD) so that a dense two-column paper becomes a clean readable page.\n- As a researcher, I want the topic sidebar on scanned/complex PDFs so that navigation doesn't depend on the author's bookmarks.\n- As a researcher, I want my reading position remembered per file so that a 300-page document resumes where I left it.\n\n**P3 — \"The Operator\" (office/admin):** receives docx/xlsx/pptx daily, reads on desktop and phone.\n- As an operator, I want attachments from my phone's share sheet to open in the app so that I can read a deck on the go.\n- As an operator, I want to export a Word file to PDF/MD so that I can archive or forward it in the format the recipient needs.\n\n**Edge/error stories**\n- As any user, when a file's format is unsupported or corrupt, I want a clear panel with an \"Open in default app\" escape hatch (never a blank screen).\n- As any user, when a PDF is a pure image scan, I want an honest \"no text layer\" indication (and OCR when available) instead of a fake outline.\n\n## 6. Requirements\n\n### Release v1.0 — \"Public desktop\" (P0 = cannot ship without)\n\n| # | Requirement | Priority | Acceptance criteria (abbrev.) |\n|---|---|---|---|\n| R1 | ⌘F in-document search (md/html-kinds + PDF text) | P0 | Match count, highlight, Enter/⇧Enter cycling; PDF matches jump to page |\n| R2 | PDF text selection layer + zoom (fit-width/page/%) | P0 | Text selectable/copyable on all text PDFs; zoom persists per tab |\n| R3 | Reading-position memory per file | P0 | Reopen within ±1 viewport of last position, across app restarts |\n| R4 | Relative `.md` links open in-app; ⌘[/] back-forward | P0 | Links to local md/files open as tabs; history navigable |\n| R5 | Native menu bar + shortcuts; real app icon + name | P0 | All features reachable via menus; branded icon in Dock/Finder |\n| R6 | Windows build (WebView2), installer, titlebar layout | P0 | Feature parity checklist passes on Win 10/11; MSI/NSIS installer |\n| R7 | Code signing + notarization (macOS), signing (Win) | P0 | No Gatekeeper/SmartScreen scare screens |\n| R8 | Auto-updater + crash-safe session | P0 | In-app update prompt; forced-quit never loses tabs |\n| R9 | Mermaid + KaTeX rendering in md | P1 | Diagrams/math render offline; failures degrade to code block |\n| R10 | Onboarding: first-run tour + shortcut sheet (⌘/) | P1 | Dismissible, < 5 screens |\n\n### Release v1.5 — \"Create, convert, visualize\"\n\n| # | Requirement | Priority |\n|---|---|---|\n| R11 | ⌘E edit mode (CodeMirror source + live preview, autosave, dirty-dot) — md/text only | P0 |\n| R12 | Export/Convert menu tier 1: MD→HTML(themed), MD→PDF, DOCX/PPTX/XLSX→MD, XLSX→CSV | P0 |\n| R13 | PDF→MD reading mode toggle (headings/paragraphs/lists from text-layer heuristics) | P0 |\n| R14 | Mind map view (markmap) from any document's topic tree; export map as SVG/MD outline | P0 |\n| R15 | MD→DOCX export | P1 |\n| R16 | Map varieties: outline tree, org-chart, Mermaid flowchart export | P1 |\n| R17 | Pandoc sidecar (optional download) for full conversion matrix | P2 |\n\n### Release v2.0 — \"Mobile + AI + Pro\"\n\n| # | Requirement | Priority |\n|---|---|---|\n| R18 | Android app (tab-switcher sheet, drawer sidebar, share-sheet intake, pinch zoom) | P0 |\n| R19 | iOS app (same mobile UI layer) | P0 |\n| R20 | Pro unlock: licensing, purchase flow (Paddle/LemonSqueezy desktop; IAP mobile) | P0 |\n| R21 | AI companion (Pro): summarize, chat-with-doc, AI concept maps, PDF→MD cleanup — user-provided or bundled API key | P0 |\n| R22 | OCR for scanned PDFs (Apple Vision on macOS/iOS; Tesseract wasm elsewhere) | P1 |\n| R23 | Folder/wiki mode + cross-file knowledge graph | P1 |\n| R24 | Full-text search across library/history | P2 |\n\n## 7. Product architecture\n\n### 7.1 Current (v0.4)\n\n```\n┌────────────────────────── macOS app (Tauri 2, ~10 MB) ─────────────────────────┐\n│  ┌──────────────────── WebView (WKWebView) ────────────────────┐               │\n│  │  index.html + app.css/themes.css + app.js (vanilla, no build)│               │\n│  │  ┌─────────┐ ┌──────────┐ ┌──────────────────────────────┐  │  ┌──────────┐ │\n│  │  │ Tab/UI  │ │ Settings │ │ Format renderers             │  │  │ Rust core│ │\n│  │  │ manager │ │ themes   │ │ md: markdown-it + hljs       │  │  │ commands │ │\n│  │  │ history │ │ profile  │ │ pdf: PDF.js 6 (+wasm,fonts)  │◄─┼─►│ read txt │ │\n│  │  │ session │ │ (local-  │ │ docx: mammoth → HTML         │  │  │ read bin │ │\n│  │  │ TOC     │ │ Storage) │ │ pptx: JSZip + own parser     │  │  │ stat/mtime│ │\n│  │  └─────────┘ └──────────┘ │ xlsx/csv: SheetJS            │  │  │ pending  │ │\n│  │        DOMPurify sanitizes│ text: pre                    │  │  │ open ext │ │\n│  │        all rendered HTML  └──────────────────────────────┘  │  │ diag log │ │\n│  └──────────────────────────────────────────────────────────────┘  └──────────┘ │\n│  macOS integration: file associations (Info.plist), RunEvent::Opened,           │\n│  overlay titlebar, asset protocol (relative images)                             │\n└──────────────────────────────────────────────────────────────────────────────────┘\n```\n\nKey properties: all libraries vendored (fully offline); one webview, no build step; formats normalized to either **HTML-in-scroller** (md/docx/xlsx/text) or **paged canvases** (pdf/pptx); every format emits a **topic tree** that powers the shared sidebar — and, next, mind maps.\n\n### 7.2 Target (v2.0)\n\n```\n                    ┌──────────── Shared web frontend (one codebase) ────────────┐\n                    │  UI shell: desktop layout ←→ mobile layout (responsive +   │\n                    │  platform flag: tabs strip ↔ tab sheet, sidebar ↔ drawer)  │\n                    │  Core services (JS modules):                               │\n                    │   • DocumentModel: {kind, source, topicTree, view state}   │\n                    │   • Renderer registry (md/pdf/docx/pptx/sheet/text/…)      │\n                    │   • ViewModes: read | edit (CM) | reading-mode | mind map  │\n                    │   • Convert engine: AST/HTML → md/html/pdf/docx/csv        │\n                    │   • Search service (in-doc now, library index later)       │\n                    │   • AI service (provider-abstracted; BYO key or Pro proxy) │\n                    │   • Licensing/Pro gate                                     │\n                    └───────────────┬────────────────────────────────────────────┘\n                                    │ Tauri IPC (commands, events, raw bytes)\n        ┌───────────────────────────┴───────────────────────────────┐\n        │                      Rust core (portable)                 │\n        │  fs read/write/stat · watcher · converter sidecar mgmt ·  │\n        │  OCR bridge (Vision/tesseract) · license verify ·         │\n        │  settings store (JSON file; localStorage → file migration)│\n        └───────┬───────────────┬───────────────┬───────────┬───────┘\n                │               │               │           │\n        ┌───────┴──────┐ ┌──────┴──────┐ ┌──────┴─────┐ ┌───┴────────┐\n        │ macOS (WK)   │ │ Windows     │ │ Android    │ │ iOS (WK)   │\n        │ .app/.dmg    │ │ (WebView2)  │ │ (WebView)  │ │ .ipa       │\n        │ notarized    │ │ MSI + sign  │ │ AAB, Play  │ │ App Store  │\n        └──────────────┘ └─────────────┘ └────────────┘ └────────────┘\n                CI: GitHub Actions matrix (tauri-action) → sign → release → update feed\n```\n\n**Architecture decisions (ADR summary)**\n1. **No frontend framework/build step** — vanilla JS has carried 5 formats + theming with zero tooling risk; revisit only if mobile UI complexity demands it (escape hatch: incremental adoption of lit/preact in one module).\n2. **Engine differences are handled by polyfill, not forking** — e.g., WKWebView lacked async-iterable ReadableStream (broke PDF.js text extraction); fixed with a guarded polyfill. Same discipline for WebView2/Android quirks.\n3. **Everything renders to either HTML or paged canvases + a topic tree** — this \"narrow waist\" is what makes search, TOC, mind maps, reading mode, and export cheap to add per format.\n4. **Settings migrate from localStorage to a JSON file in app-data** (Rust-owned) before mobile — webview storage is too fragile across OS updates and needed for cross-device manual sync.\n5. **AI is provider-abstracted** — v1: user's own Anthropic key; Pro option later: proxied key with usage caps (the only server component in the product, kept optional).\n\n## 8. Execution plan\n\n### Workstreams\n\n- **WS-A Reader polish** (R1–R5, R9, R10) — pure frontend + light Rust.\n- **WS-B Platform & distribution** (R6–R8, CI, signing, updater, branding) — mostly config/infra.\n- **WS-C Create/Convert** (R11–R17) — frontend + write commands + converters.\n- **WS-D Visualize** (R14, R16, R23) — markmap/graph rendering on the topic-tree waist.\n- **WS-E Mobile** (R18, R19) — responsive UI layer + mobile plugins + store ops.\n- **WS-F Monetize + AI** (R20–R22) — licensing, purchase flow, AI service.\n\n### Milestones & timeline (solo founder + AI-assisted dev; calendar weeks)\n\n| Week | Milestone | Contents | Gate to pass |\n|---|---|---|---|\n| W1–2 | **M1: v1.0-beta desktop** | WS-A complete on macOS; branding (name+icon) decided | Daily-driver test: 1 week of real use, zero data loss |\n| W3–4 | **M2: v1.0 public** | WS-B: Windows port, signing both OS, CI, updater, landing page | Clean install on fresh macOS+Win machines; SmartScreen/Gatekeeper silent |\n| W5–6 | **M3: v1.5** | WS-C tier-1 + WS-D rung-1 (edit, export, reading mode, mind maps) | Convert/export round-trip QA suite passes |\n| W7–9 | **M4: mobile alpha** | WS-E Android first (sideload APK), mobile UI layer; iOS build boots | Read all 6 formats + share-sheet intake on 2 real devices |\n| W10–12 | **M5: v2.0** | iOS polish, store submissions, WS-F (Pro + AI v1) | Store approvals; purchase → unlock → restore flow verified |\n\n*Buffer built in: store review cycles (1–7 days each) overlap W10–12. If solo bandwidth is < full-time, stretch each block ×1.5–2; the sequence holds.*\n\n### Definition of done (every milestone)\nFeature checklist passes on all target platforms → no P0 bugs open → README/docs updated → tagged release built by CI (never a laptop build).\n\n## 9. Resources\n\n**People (lean plan)**\n- 1 × founder-engineer (you) + AI pair (Claude Code) — all workstreams. Realistic at the stated timeline if ~full-time.\n- *Optional accelerators:* freelance designer for icon/branding/store assets (~1 week, $500–1.5k); Android/iOS QA via friends+TestFlight/internal track (free).\n\n**Money (year-1 run costs)**\n| Item | Cost |\n|---|---|\n| Apple Developer Program (notarization + App Store) | $99/yr |\n| Google Play registration | $25 once |\n| Windows code-signing cert (OV via Azure Trusted Signing) | ~$10–120/yr |\n| Domain + static landing page (GitHub Pages/Cloudflare) | ~$15/yr |\n| Payment provider (Paddle/LemonSqueezy) | % of sales only |\n| LLM API for AI features | $0 (BYO key) → usage-based if Pro-proxied |\n| CI (GitHub Actions, public repo or free tier) | $0 |\n| **Total fixed** | **≈ $150–260/yr** |\n\n**Tooling:** GitHub (repo, Actions, Releases, Pages) · tauri-action CI · Paddle or LemonSqueezy (desktop licensing + payments, handles VAT) · TestFlight + Play internal track · Plausible/none for site analytics.\n\n## 10. Monetization\n\n- **Free (forever):** all reading features, all formats, themes, tabs, search, sessions — the full \"best viewer\" promise, on every platform. Free is the moat and the funnel.\n- **Pro (one-time, ~$25 desktop / ~$15 mobile IAP, own-key AI included):** AI companion (summarize, chat, concept maps, PDF→MD cleanup), advanced export (DOCX, pandoc matrix), mind-map varieties + knowledge graph, OCR. One-time fits local-first trust; price anchors against Marked 2 ($14, md-only) and Obsidian Commercial ($50/yr).\n- **Explicitly rejected:** subscriptions for local features; ads; telemetry-funded anything.\n\n## 11. Success metrics\n\n**Leading (first 30–90 days after each release)**\n- Crash-free sessions ≥ 99.5% (crash reporter, opt-in).\n- Median open-to-paint: md < 300 ms, typical PDF < 3 s (built-in perf marks, local only).\n- ≥ 60% of beta users still using at day 14 (TestFlight/Play console).\n- Topic-sidebar success rate ≥ 90% on a 100-doc benchmark corpus (internal QA metric).\n\n**Lagging (6 months)**\n- 1,000+ downloads across platforms; 4.5★+ store average.\n- Pro conversion ≥ 4% of MAU (stretch 7%); refund rate < 3%.\n- ≥ 30% of sessions open a non-md format (validates multi-format bet).\n\n**Measurement note:** local-first means no default telemetry. Metrics come from store consoles, opt-in crash reports, and an opt-in anonymous ping (count-only). This is a stated product value, not a gap.\n\n## 12. Risks & mitigations\n\n| Risk | Likelihood | Impact | Mitigation |\n|---|---|---|---|\n| Per-engine webview bugs ×4 platforms (the ReadableStream class of problem) | High | Medium | Guarded polyfills; per-platform smoke-test checklist in CI; test on real devices early (M4 gate) |\n| Mobile UX is a real redesign, not a port | High | Medium | Dedicated mobile UI layer in W7–9; Android-first to iterate cheaply |\n| App Store review friction (BYO API key rules, \"reader\" app rules) | Medium | Medium | AI as Pro IAP or desktop-only initially; no external purchase links on iOS |\n| PPTX/PDF fidelity complaints at public scale | Medium | Medium | Set expectations in-product (\"approximation\" badge + open-in-default); fidelity ladder as ongoing work |\n| Solo-founder bandwidth; timeline slips | High | Low | Milestones are independently shippable; v1.0 alone is a complete product |\n| Big-co feature overlap (Apple/Google add reading modes) | Low | Medium | Multi-format + local-first + cross-platform combo remains un-replicated; speed is the defense |\n| One-time pricing caps revenue | Medium | Low | Acceptable for indie scale; AI-proxy Pro tier is the optional recurring lever later |\n\n## 13. Open questions\n\n1. **Product name + brand** — resolved: named **Vedrix** with a geometric \"V\" mark (the earlier \"Markdown Viewer\" working title undersold a multi-format reader). *(Owner: Adithya.)*\n2. **AI key model at launch** — BYO-key only (simple, private) vs. bundled proxy (better UX, needs server + cost controls)? *(Owner: Adithya; blocks R21 design, not earlier milestones.)*\n3. **Pro pricing final** — $19/$25/$29 desktop; regional pricing for India? *(Owner: Adithya; blocking M5.)*\n4. **Opt-in telemetry** — ship a count-only anonymous ping, or zero-telemetry as a marketing stance? *(Blocking landing-page copy, not code.)*\n5. **Linux** — free to build via CI; do we publish unsupported builds? *(Non-blocking.)*\n6. **Repo visibility** — open-core (viewer OSS, Pro closed) vs. fully closed? Affects trust, contributions, and Pro enforcement. *(Owner: Adithya; decide before public launch.)*\n\n## 14. Appendix\n\n- **Roadmap & ideation:** `docs/ROADMAP.md` (themes 1–10, phasing A–E).\n- **Known engineering notes:** WKWebView ReadableStream polyfill (app.js top); brew-rustup PATH (`/opt/homebrew/opt/rustup/bin`); DMG bundling requires non-headless session; assets embed into the binary (keep personal files out of `src/`).\n- **Benchmark corpus (to build, W1):** 100 real-world docs across formats/scripts for sidebar-quality and perf regression testing.\n"}, {"id": "roadmap", "title": "Roadmap & Ideation", "group": "Product", "md": "# Vedrix — Roadmap & Ideation\n\n*Drafted 2026-07-03, after v0.4 (tabs, themes, multi-format, topic sidebars).*\n\n## Where we are\n\nA 10 MB native viewer that opens MD / PDF / DOCX / PPTX / XLSX / CSV / text in\nChrome-style tabs, with 10 themes, topic sidebars for every format, live\nreload, history, session restore, resizable sidebar, and auto-hiding scroll\nindicators. The core \"double-click → read\" promise is delivered. The next\nphases turn a *viewer* into a *reading workspace*.\n\n---\n\n## Theme 1 — Deeper reading & navigation\n\n| Feature | Notes | Effort |\n|---|---|---|\n| ⌘F in-document search | Find bar, highlights, match count, Enter/⇧Enter. MD **and** PDF (PDF.js exposes per-page text) | M |\n| PDF text selection & copy | Add PDF.js invisible text layer over each canvas | M |\n| PDF zoom | Fit-width / fit-page / % zoom, pinch gesture | S–M |\n| Reading position memory | Store scroll position in history; reopen where you left off | S |\n| Relative `.md` links in-app | Click local md link → new tab. Foundation for wiki mode | S |\n| Back/forward nav | ⌘[ / ⌘] across link jumps and TOC clicks | S |\n| Mermaid + KaTeX | Diagrams + math in markdown | S |\n| Presentation mode | Full-screen slide-per-screen for PPTX and MD (H2 = slide) | M |\n\n## Theme 2 — From files to a library\n\n- **Folder / wiki mode** — open a folder → file tree beside Contents (two sidebar tabs). (M)\n- **Full-text search across library** — index folder + history (FlexSearch or similar). (M–L)\n- **Pinned tabs** for daily-driver docs. (S)\n- **Split view** — two documents side by side. (M)\n- **Tab overview** (⌘⇧A) — grid of open tabs with previews. (M)\n\n## Theme 3 — Light document workflows (view-first, no editing)\n\n- **Annotations & highlights** — select → highlight/margin note, stored sidecar (file untouched), listed in a sidebar panel. (L)\n- **Bookmarks / reading list** — star docs/positions; \"Continue reading\" on the empty screen. (S)\n- **Export engine** — styled print/⌘P, MD → PDF/HTML in current theme, copy-as-rich-text. (M)\n- **OCR for scanned PDFs** — Apple Vision framework (on-device, strong Indic script support) for image-only pages → topics + search work on scans. (M–L)\n\n## Theme 4 — AI layer\n\n- Summarize document/section (side panel).\n- Chat with the open document (user's Claude API key in settings).\n- Smart topics when heading heuristics fail.\n- Inline translation toggle (Devanagari ↔ English mixed documents).\n\n## Theme 5 — Format depth\n\n- **PPTX fidelity ladder**: bullets/indent → shape fills → tables → layout/master inheritance → charts-as-tables → speaker notes. Each rung standalone. (S each)\n- **XLSX**: sheet tabs UI, virtualized big sheets, number formats. (M)\n- **New formats**: `.ipynb` notebooks, EPUB, images, syntax-highlighted source files. (S–M each)\n\n## Theme 6 — macOS citizenship\n\n- Custom app icon (still the default Tauri icon — overdue). (S)\n- Native menu bar + Dock recent-files menu. (S–M)\n- Quick Look extension. (M)\n- `mdv` CLI. (S)\n- Signing, notarization, auto-updater — needed the day it's shared. (M)\n\n## Theme 7 — Performance & robustness\n\n- Virtualized rendering for very large markdown files; parse in a worker.\n- PDF memory cap (destroy far-off-screen canvases); re-render pages on window resize.\n\n---\n\n## Theme 8 — Create & convert *(added 2026-07-03)*\n\n- **Export/Convert menu**, built as a ladder:\n  - Tier 1: MD → self-contained themed HTML; MD → PDF (themed print pipeline);\n    DOCX/PPTX/XLSX → MD (existing HTML pipeline + Turndown); XLSX → CSV.\n  - Tier 2: MD → DOCX (`docx` JS library).\n  - Tier 3: optional **pandoc sidecar** (one-time ~30 MB download) for the full\n    matrix — EPUB, LaTeX, ODT.\n- **Edit mode (⌘E)** — per-tab toggle: CodeMirror source + live preview\n  side-by-side, debounced auto-save (live-reload watcher paused during writes),\n  dirty-dot on tab. MD/plain-text only; app stays reader-first by default.\n- **PDF → MD reading mode** — extends the existing per-line font-size\n  extraction: size tiers → headings, spacing → paragraphs, bullet glyphs →\n  lists. Toggle on every PDF tab (Safari Reader-style). Tables/multi-column are\n  best-effort v1; AI cleanup pass later (Theme 4). Output is a real MD tab →\n  exportable via the Convert menu.\n\n## Theme 9 — Mind maps & graphs *(added 2026-07-03)*\n\nLadder, each rung standalone:\n1. **Structure mind map** — the heading/topic tree we already build for every\n   format, rendered with **markmap** (vendorable, interactive). \"Mind map\"\n   toggle on any tab — works for PDFs and decks too. Quick win.\n2. **Map varieties** — same tree, more renderers: outline tree, org-chart,\n   Mermaid flowchart/timeline (also exportable as markdown/mermaid).\n3. **AI concept maps** (NotebookLM-style) — LLM emits concept hierarchy /\n   relationship JSON, rendered with the same engines.\n4. **Knowledge graph across files** — needs folder mode; parse `[[links]]` and\n   relative links → force-directed library graph (Cytoscape.js), Obsidian-style.\n\n## Theme 10 — Productization: Android · iOS · Windows · macOS *(added 2026-07-03)*\n\nTauri 2 supports all four natively; the frontend is dependency-light vanilla\nweb, so the codebase carries over. Sequencing by effort:\n\n1. **Windows** (days): WebView2/Chromium (more standards-compliant than\n   WKWebView; polyfills already guarded). Needs Windows titlebar layout\n   (traffic-light overlay is macOS-only), MSI/NSIS installer, signing cert.\n2. **Android**: `tauri android init`; real work is mobile UX — tab switcher\n   sheet, sidebar drawer, pinch/touch gestures, share-sheet open-with,\n   document-picker storage. Play Store: $25 one-time.\n3. **iOS**: mobile UI carries over; Apple Developer Program $99/yr, stricter\n   review.\n4. **Plumbing**: GitHub Actions CI matrix (tauri-action, all targets),\n   auto-updater, crash reporting, branding (name, icon, landing page).\n\n**Monetization framing:** free core viewer everywhere + one-time Pro unlock\n(AI features, mind maps, pro export). Subscriptions fight the local-first\nidentity.\n\n---\n\n## Deliberately not building\n\n- **Cloud sync / accounts** — local-first is the feature.\n- **Plugin system** — premature until the reading core plateaus.\n- ~~Editing~~ — *reversed 2026-07-03 by product decision*: lightweight ⌘E edit\n  mode ships in Phase B, but reader-first identity stays (no IDE ambitions).\n\n## Phasing\n\n| Phase | Contents | Rough size |\n|---|---|---|\n| **A — Serious reader** ✅ *shipped 2026-07-03 (v0.9)* | ⌘F, PDF selection + zoom, position memory, relative links, Mermaid/KaTeX, app icon (\"Vedrix\" branding), native menus, shortcuts sheet | done |\n| **B — Create & convert** ◐ *core shipped 2026-07-03* | ⌘E edit mode ✅ · Export MD/HTML/CSV + print-to-PDF ✅ · PDF→MD reading mode ✅ · remaining: MD→DOCX (R15), pandoc sidecar (R17) | done except R15/R17 |\n| **C — Visualize** ✅ *shipped 2026-07-03* | Mind map view (⌘M, markmap) for every format ✅ · exports SVG / Mermaid mindmap / MD outline ✅ · folder/wiki mode (⌘⇧O) ✅ · knowledge graph of [[wikilinks]] + relative links (⌘G, d3-force) ✅ | done |\n| **D — AI companion** ✅ *shipped 2026-07-03* | Provider-agnostic AI — **any** model (Anthropic, OpenAI, Google, OpenRouter, Groq, DeepSeek, Mistral, Ollama, LM Studio, custom) via preset dropdown + editable base URL / model / key ✅ · calls routed through a Rust proxy (bypasses CORS + macOS ATS so local http endpoints work) ✅ · Summarize ✅ · Chat ✅ · Translate → new tab ✅ · AI concept map ✅ · schema-with-graceful-fallback for JSON ✅ | done |\n| **E — Productize** ◐ *in progress 2026-07-03* | Cross-platform code (open_externally mac/win/linux, temp-dir diag, platform-split window config, mac-gated titlebar, `#[cfg(desktop)]` menu) ✅ · GitHub Actions release matrix ✅ · `docs/BUILDING.md` ✅ · **Responsive mobile UI** (≤720px: drawer sidebar, ⋯ overflow menu, full-screen AI sheet, 40px touch targets, PDF pinch-zoom, mobile-aware empty state + onboarding) ✅ · **Android APK built & verified running on Android 14 emulator** (toolchain: JDK17 + SDK34 + NDK 27.2; `~/Desktop/Vedrix-debug.apk`) ✅ · remaining: run Windows build via CI, signing/notarization, auto-updater, Android share-sheet file intake + Play release, iOS (needs Xcode), Pro packaging | in progress |\n| Continuous | One PPTX fidelity rung + one perf item per phase; library features (search-all, split view, annotations, OCR) slot in where they unblock a phase | — |\n\nOrdering logic: B before C (export/edit infra is what mind-map export reuses);\nE last because each prior phase multiplies what ships on five platforms — but\nthe Windows build is cheap enough to pull forward anytime as a proof point.\n\n**Recommendation:** Phase A next, then B.\n"}, {"id": "vedrix-features-and-ux", "title": "Features & UX", "group": "Product", "md": "# Vedrix — Features & Functionality (for Design)\n\n_Living document for the design team. Describes what exists today, how it behaves, and where the UX/UI needs design work. Version as of 2026-07-04._\n\n* * *\n\n## 1\\. What Vedrix is\n\n**A local-first, instant document workspace.** Open Markdown, PDF, Word, PowerPoint, Excel, HTML, or plain text — read it beautifully, edit it like a document, visualize it, and never touch a cloud. One fast window; no accounts; works offline.\n\n**Positioning:** _“Every document your day throws at you — opened in under a second, readable like a book, editable like Notion, and yours alone.”_\n\n**Platforms (one codebase):** macOS ✅, Android ✅, Windows/Linux ✅ (installers). iOS planned. The UI must work identically on desktop (mouse/keyboard, ≥720px) and mobile (touch, ≤720px).\n\n**Tech reality designers should know:** Vedrix is a native shell (Tauri) around a web UI. Rendering and editing happen in a webview. There is **no design-system framework** — it’s hand-built CSS with a themeable variable layer (see §12). Documents are stored as **Markdown files on disk** (this constrains what editing can persist — see §7).\n\n* * *\n\n## 2\\. The core screen (information architecture)\n\n```\n┌────────────────────────────────────────────────────────────┐\n│ TOPBAR:  ☰   [tab][tab][tab]  +      ✦ ⟨map⟩ ⟨Aa⟩ ⟨edit⟩  Open  ⏱ ☀ │\n├──────────┬─────────────────────────────────────────────────┤\n│ SIDEBAR  │                                                  │\n│ (Contents│              CONTENT PANE                        │\n│  or Files│   (rendered doc / editor / pages / map / graph)  │\n│  tabs)   │                                                  │\n│          │                                    [AI PANEL →]   │\n└──────────┴─────────────────────────────────────────────────┘\n```\n\n-   **Topbar** — sidebar toggle, tab strip, new-tab, contextual actions (mind map, format-specific toggle, edit), Open, history, settings/theme.\n-   **Sidebar** — two modes via sub-tabs: **Contents** (document outline) and **Files** (folder tree, when a folder is open). Resizable, collapsible; becomes a slide-in **drawer** on mobile.\n-   **Content pane** — hosts one of several “panes”: reader, editor, paged viewer, mind map, knowledge graph.\n-   **AI panel** — right-side dock (full-screen sheet on mobile).\n\n**Design opportunity:** the topbar is getting crowded as features grow. The contextual buttons (map/format-toggle/edit) appear/disappear per document type. A cleaner, more legible command surface is a priority design task (see §13).\n\n* * *\n\n## 3\\. Opening documents & supported formats\n\n**Ways to open:** double-click in Finder/Explorer (file association), drag-and-drop onto the window, ⌘O / Open button, `+` new tab, Android document picker / share sheet (planned), recent-files list.\n\n**Formats and how each renders:**\n\n| Format | Rendering | Interactivity today | Target interactivity |\n| --- | --- | --- | --- |\n| **Markdown** (.md) | GitHub-style, syntax-highlighted code, tables, task lists, math (KaTeX), diagrams (Mermaid), callouts | Full read + edit | — |\n| **PDF** | Page canvases + selectable text layer | Scroll, select/copy, zoom, find, PDF→Markdown “reading mode” | Annotations, form fields |\n| **Word** (.docx) | Converted to styled HTML | Read, find, export, mind map | Edit (later) |\n| **PowerPoint** (.pptx) | Slides rendered as pages | Scroll through slides | **Presentation mode** (full-screen, arrow-key slideshow) — see §9 |\n| **Excel** (.xlsx/.xls/.csv) | Tables per sheet | Read, find | Sheet tabs, sort/filter, big-sheet virtualization |\n| **HTML** (.html) | **Two modes:** Interactive (scripts run, full prototypes/dashboards) · Reader (script-stripped, TOC/find) | Interactive = fully live; Reader = read/search | Link-nav policy, per-tab default |\n| **Text/JSON/logs** | Monospace, read + edit | Full | Syntax highlighting for code files |\n\n**Design note — “make every format interactive”:** each format has a different ceiling. Markdown/HTML/text are fully interactive. PDF is interactive within reading (select, zoom, find). PPTX’s natural “interactive” form is a **slideshow/presenter mode** (the biggest format-specific design task). Excel’s is **sortable/filterable sheets**. The doc should treat “interactivity” per format, not as one feature.\n\n* * *\n\n## 4\\. Tabs & session\n\n-   **Chrome-style tabs** — multiple documents open at once; each remembers scroll position, zoom, edit state.\n-   **Draggable to reorder**, close button per tab, dirty-dot when unsaved, live-reload dot when the file is being watched.\n-   **Session restore** — reopens your tabs on relaunch (toggle in Settings).\n-   Mobile: tab strip is horizontally scrollable; ⌘⌥←/→ or swipe to switch.\n\n**Design opportunity:** at 10+ tabs the strip is cramped. A **tab overview** (grid with previews) and/or **vertical tab list** is worth designing. This also connects to the requested **project grouping** (§10) — tabs could be grouped/ colored.\n\n* * *\n\n## 5\\. Reading experience\n\n-   **10 themes** — System, GitHub Light/Dark, Dracula, Nord, Monokai, One Dark, Solarized Light/Dark, Sepia. Each themes the whole app _and_ code syntax colors. Chosen from a swatch grid in Settings.\n-   **Typography controls** — content width (Narrow/Normal/Wide/Full), font family (System/Serif/Mono), font size. In Settings; also reachable from the editor “Aa” button.\n-   **Table of contents** — auto-built from headings for every format (including extracted PDF/PPTX topics); scroll-synced active highlight; click to jump.\n-   **Find (⌘F)** — in-document search with match count, next/prev, highlights; works in Markdown, Office docs, PDF (page text), and Reader-mode HTML.\n-   **Zoom** — for PDF/slides (fit-width, %, pinch on mobile).\n-   **Auto-hiding scroll indicator** — custom thin thumb that appears only while scrolling (native bars hidden).\n-   **Reading position memory** — reopen any file where you left off.\n\n**Design opportunities:** the theme picker, typography panel, and reading controls are functional but visually plain. This is prime surface for design polish. Also: a distraction-free/focus reading mode is unbuilt and desirable.\n\n* * *\n\n## 6\\. Multi-format specifics worth designing\n\n-   **PDF reading mode (“Aa”)** — converts a PDF’s text into clean Markdown (Safari Reader-style) in a new tab: headings from font sizes, paragraphs, lists. Good candidate for a nicer toggle affordance and a “before/after” transition.\n-   **HTML Interactive/Reader toggle (“⚡/Aa”)** — Interactive runs the page live (dashboards, prototypes) in an isolated frame; Reader strips scripts for reading/search. Needs a clearer, more discoverable mode indicator.\n-   **Spreadsheets** — currently stacked tables. Design need: sheet tabs, sticky headers, and eventually sort/filter controls.\n\n* * *\n\n## 7\\. Editing (Notion-grade, markdown-first)\n\nVedrix has a full editor reachable with **⌘E**. Two surfaces, toggled by a floating **Text / Source / Done** pill:\n\n-   **Text (WYSIWYG-style)** — the _rendered_ document becomes directly editable. You type into the beautiful view, not raw syntax. This is the default.\n-   **Source** — a raw-markdown code editor (CodeMirror) for precise syntax work.\n-   **Done** — exits and saves.\n\n**Editing toolbar** (top, in edit mode): `↶ ↷ | Block-type ▾ | B I S <\/> H(highlight) 🔗 | • 1. ☑ | ─ ⊞ 🖼 ∑ ⤳ | Aa`\n\n-   Undo/redo (custom history stack, depth 200)\n-   Block type dropdown: Paragraph, H1–H4, Quote, Code block\n-   Marks: bold, italic, strike, inline code, highlight, link (mini popover)\n-   Lists: bullet, numbered, to-do checkboxes\n-   Insert: divider, table, image (file picker → relative path), math block, mermaid diagram\n-   “Aa”: document appearance (font/size/width)\n\n**Notion-style interactions:**\n\n-   **Selection bubble** — select text → floating B/I/S/code/highlight/link.\n-   **Slash menu** — type `/` → searchable block palette (17 blocks incl. headings, lists, to-do, table, divider, image, math, diagram, callouts).\n-   **Autoformat while typing** — `##` →H2, `-` →bullet, `[]` →to-do, `>` →quote, ` ``` `→code, `1.` →numbered.\n\n**Power editing (E3):**\n\n-   **Table tools** — cursor in a cell shows a bar: add/delete row/column.\n-   **Drag-to-reorder blocks** — ⠿ handle on hover; drag any block to reorder.\n-   **Callouts** — `/callout` inserts colored note/tip/warning admonition blocks.\n-   **Find & replace** — replace / replace-all in the find bar.\n-   **Highlight** — `<mark>` text; survives save.\n\n**The storage constraint (important for design):** documents save as **Markdown**. Markdown can express headings, bold/italic/strike, code, links, images, lists, tasks, tables, quotes, dividers, math, mermaid, callouts, highlight. It **cannot** natively express per-character fonts/colors/sizes or alignment. Document-level font/size/width is a _view setting_, not saved into the file. Per-selection color would need opt-in inline HTML. **Design should not promise per-character typography as a core editing feature** unless we consciously move to a richer storage format (a product decision, currently “no”).\n\n**Design opportunities:** the toolbar iconography is placeholder-grade (emoji/ unicode). A proper icon set, a refined selection bubble, a polished slash menu, and mobile editing ergonomics (toolbar above keyboard) are all open.\n\n* * *\n\n## 8\\. Visualization\n\n-   **Mind map (⌘M)** — any document’s heading/topic tree rendered as an interactive, collapsible mind map (markmap). Works for MD, PDF, DOCX, PPTX. Export as SVG, Mermaid mindmap, or Markdown outline.\n-   **Knowledge graph (⌘G)** — when a folder is open, a force-directed graph of files linked by `[[wikilinks]]` and relative links (Obsidian-style). Drag nodes, click to open.\n\n**Design opportunities:** both are functional D3/markmap renders with minimal styling. Node design, colors (ties to §10 categorization), layout controls, and a legend are open design work.\n\n* * *\n\n## 9\\. Folder / library mode\n\n-   **Open a folder (⌘⇧O)** → the sidebar’s **Files** tab shows a file tree.\n-   Browse a docs folder like a mini-wiki; relative and `[[wiki]]` links navigate in-app; back/forward (⌘\\[ / ⌘\\]).\n-   Feeds the knowledge graph.\n\n**This is where “project grouping / categorization” lands** (§10). Today the file tree is a plain nested list. The requested color-coding, icons, and grouping are a **major design area**.\n\n* * *\n\n## 10\\. ⭐ Requested: Projects, grouping & categorization (to design)\n\n**User goal:** organize documents into projects/groups with **color coding, icons, and more** — so the library isn’t a flat list.\n\nThis is greenfield for design. Proposed scope for the design team to shape:\n\n-   **Projects/Collections** — named groups a user creates. Each has:\n    -   a **color** (from a palette; ties into themes)\n    -   an **icon** (emoji and/or icon set)\n    -   optional description\n-   **Assignment** — a document/folder belongs to one or more projects. Drag a tab or file into a project; or right-click → Add to project.\n-   **Surfaces that show grouping:**\n    -   Sidebar: a **Projects** section above/beside Files, colored & icon’d.\n    -   Tabs: optional colored underline/group by project.\n    -   Empty/home screen: project cards as entry points.\n    -   Mind map & graph: node colors inherit project color.\n-   **Categorization vs. Projects** — do we also want lightweight **tags/labels** (many-per-doc, filterable) in addition to projects (folder-like)? Design to recommend the model. Likely: **Projects = primary organization (1:1-ish), Tags = cross-cutting labels.**\n-   **Filtering/search** — filter the library by project/tag/color.\n-   **Persistence** — stored in local app data (not inside the .md files), so it works across formats and never pollutes documents.\n\n**Key design questions:** Where does project management live (dedicated view vs. sidebar section)? How is a “home/dashboard” of projects presented? How do colors coexist with the 10 themes without clashing? Icon system (emoji vs. custom set)? Mobile representation?\n\n**Deliverable for design:** a projects/library IA + visual system, including the home screen, sidebar treatment, color/icon palette, and the create/assign flows.\n\n* * *\n\n## 11\\. ⭐ Requested: Import & Export (to design + build)\n\n**Today (built):** Export a document → Markdown, HTML (themed, self-contained), CSV (sheets), PDF (via print). PDF→Markdown reading mode. Opening files = import.\n\n**Requested expansion:**\n\n-   **Export to more formats** — DOCX, PPTX, images (PNG of a rendered doc/mind map), EPUB, plain text, and “copy as rich text.” A **pandoc sidecar** (optional download) can unlock the long tail (LaTeX, ODT, etc.).\n-   **Import flows** — beyond open-file: import a folder as a project, import from a URL (fetch a page → Reader/Markdown), paste HTML → Markdown, import from other note apps (Obsidian vault, Notion export .zip).\n-   **Batch export** — export a whole project/folder to a chosen format.\n\n**Design needs:** an **Export dialog** (format picker + options: theme, page size, include/exclude TOC) and an **Import entry point** (formats, source: file/ folder/URL/clipboard/other-app). Today export is a flat menu — it needs a real dialog with previews and options. Also a consistent place for both in the IA.\n\n* * *\n\n## 12\\. AI companion\n\n-   **AI panel (✦ / ⌘J)** — right-side chat grounded in the open document.\n    -   Summarize document, Translate, generate an AI **Concept Map** (feeds the mind-map view).\n    -   Chat with the document.\n-   **Bring-your-own key** — user provides an API key in Settings; provider-open.\n-   Mobile: full-screen sheet.\n\n**Design opportunities:** the panel is functional but plain. Message design, streaming states, action affordances (summarize/translate/concept-map as first-class buttons vs. buried), inline “ask about this selection”, and a non-chat “quick actions” surface are all open.\n\n* * *\n\n## 13\\. Mobile UX (built, needs polish)\n\nAt ≤720px Vedrix switches to a mobile layout:\n\n-   Topbar collapses to `☰ · tabs · + · ✦ · ⋯`; the rest moves into a **⋯ overflow menu**.\n-   Sidebar becomes a **slide-in drawer** with backdrop.\n-   AI panel becomes a **full-screen sheet**.\n-   **Safe-area insets** keep the topbar clear of the status bar / notch.\n-   40px touch targets, pinch-to-zoom on PDFs/slides, contenteditable editing with the on-screen keyboard.\n\n**Design opportunities:** the mobile toolbar for editing (should dock above the keyboard), the overflow menu (could be a bottom sheet), tab switching (a tab sheet vs. the cramped strip), and gesture affordances (swipe-back, pull actions).\n\n* * *\n\n## 14\\. Settings, history, personalization\n\n-   **Settings** — theme grid, typography, profile name (greets you on the home screen), session-restore toggle, AI key, clear history.\n-   **History** — every opened file (with location + time), reopenable; recents on the home screen.\n-   **Home/empty screen** — icon, greeting, format hint, recent files. This is a prime **design canvas** — today minimal; could become a project dashboard (§10).\n\n* * *\n\n## 15\\. Design system (current constraints)\n\n-   **Theming via CSS variables:** `--bg` (content), `--panel` (bars/chrome), `--border`, `--fg`, `--text-muted`, `--accent`, `--hover`, `--ok`. Every surface uses these; a new theme = one variable block. Designs should be expressed in these tokens so they work across all 10 themes.\n-   **Type:** system font stack default; serif and mono options.\n-   **Iconography:** currently a mix of inline SVG (topbar) and emoji/unicode (toolbar). **A unified icon set is an explicit design need.**\n-   **Components in play:** tabs, buttons (icon + text), segmented controls, swatches, floating popovers/bubbles, menus, modals (Settings/shortcuts), side panels, toolbars, pills, file tree, cards (recents).\n-   **Motion:** minimal today (drawer slide, scroll-thumb fade). Opportunity for a considered, restrained motion system.\n\n**Ask to design:** a proper component library / design tokens in Figma that map to these CSS variables, plus the icon set — so engineering can implement 1:1.\n\n* * *\n\n## 16\\. Priorities for the design team\n\n1.  **Projects / grouping / categorization** (§10) — biggest net-new IA + visual system. Home/dashboard, sidebar, colors, icons, tags.\n2.  **Command surface & topbar** (§2, §4) — declutter, contextual actions, tab grouping/overview.\n3.  **Editor polish** (§7) — icon set, selection bubble, slash menu, mobile editing toolbar.\n4.  **Import/Export dialog** (§11) — real dialogs with options/preview.\n5.  **Per-format interactivity** (§3) — esp. **PPTX presentation mode**, Excel sheet UX.\n6.  **Home screen** (§14) — from minimal to a real entry point / dashboard.\n7.  **Component library + icon set + tokens** (§15) — the foundation that makes all of the above implementable consistently.\n\n## 17\\. Open product questions (design + product to resolve)\n\n-   Projects vs. tags: one model or both? Primary org unit?\n-   Does Vedrix get a persistent “home/dashboard,” or stay document-first?\n-   How far does editing go for non-Markdown formats (edit DOCX? never)?\n-   Per-selection color/fonts: keep markdown-pure, or offer a richer opt-in mode?\n-   Presentation mode scope for PPTX (and Markdown slides?).\n-   Mobile: how much editing is realistic vs. read-first?"}, {"id": "plan-notion-features", "title": "Ideation · Local-first Notion", "group": "Product", "md": "# Ideation — Vedrix as a local-first Notion\n\n**Status:** ideation / not committed to a release · **Date:** 2026-08-01 · **Owner:** Adithya\n\n---\n\n## 1. The one-line thesis\n\n> **Notion, if your workspace were a folder of files you own.**\n\nNotion won by making one idea feel effortless: *everything is a block, and any collection of blocks can become a database.* Its cost is that your work lives in someone else's database, reachable only through their app, only online, only while you keep paying.\n\nVedrix already has the opposite property — **plain files on disk, opened instantly, offline, no account.** The opportunity is not to clone Notion's feature list; it's to deliver Notion's *feel* on top of files that outlive the app.\n\n**The bet:** most people don't need real-time multiplayer. They need structure, views, linking, and a fast editor. That subset is ~85% of daily Notion use, and *all of it* can be done markdown-first.\n\n### The non-negotiable constraint\n\nEvery feature below is judged against one rule:\n\n> **If Vedrix disappeared tomorrow, the user's work must still open in any text editor, and still make sense.**\n\nThis rule is what makes the product different. It also *kills* certain features outright — those are named honestly in §7 rather than quietly dropped.\n\n---\n\n## 2. Where Vedrix already stands\n\nFar more of the foundation exists than a blank-slate plan would assume. This ideation builds on shipped code, not greenfield.\n\n| Notion pillar | Vedrix already has | Gap to close |\n| --- | --- | --- |\n| Block editor | Rich editor, slash menu, callouts (`> [!note]`), tables, math, Mermaid, inspector | Toggles, columns, transclusion, templates |\n| Wiki / knowledge | Vault-wide search, graph view, mind map, projects & tags, folder tree | `[[wikilinks]]`, backlinks, page tree as primary nav |\n| Databases | Projects, tags, library sidecar | Folder-as-database, views, filters, relations, formulas |\n| Collaboration | Highlights & margin notes (sidecar), export, static-site publish (this hub) | Comments on blocks, version history, share links |\n| AI | Chat, summarize, translate, rewrite, AI→Canvas | AI over the *workspace*, not just the open doc |\n| Canvas | Excalidraw, doc cards, cross-linking | — (already ahead of Notion here) |\n\n**Read:** the editor and knowledge layers are ~70% there. **Databases are the real build.** Collaboration is the honest-limits conversation.\n\n---\n\n## 3. The architecture: files as the source of truth\n\nFour primitives. Everything else composes from them.\n\n### 3.1 Page = a Markdown file\n\n```markdown\n---\ntitle: Q3 launch plan\nstatus: In progress\nowner: [[people/adithya]]\ndue: 2026-09-30\ntags: [launch, marketing]\n---\n\n# Q3 launch plan\n...\n```\n\nFrontmatter *is* the property system. No hidden database — open it in any editor and the properties are readable prose. This is the single highest-leverage decision in the document: it makes properties, databases, filters, and rollups all fall out of a format users already own.\n\n### 3.2 Database = a folder + a schema file\n\n```\nProjects/                      ← the database\n├── _vedrix.db.yaml            ← schema + saved views\n├── q3-launch.md               ← a row (a page)\n├── website-redesign.md        ← a row\n└── hiring.md                  ← a row\n```\n\n```yaml\n# _vedrix.db.yaml\nname: Projects\nproperties:\n  status:  { type: select, options: [Backlog, In progress, Done], color: true }\n  owner:   { type: relation, to: People }\n  due:     { type: date }\n  effort:  { type: number, format: days }\n  done:    { type: formula, expr: 'status == \"Done\"' }\nviews:\n  - { name: Board,    type: board,    group: status, sort: [due asc] }\n  - { name: This week,type: table,    filter: 'due <= today + 7d and status != \"Done\"' }\n  - { name: Calendar, type: calendar, date: due }\n```\n\nA row is a page. A page is a file. A view is a saved query — **views never own data**, so deleting the schema file loses your *views*, never your *content*.\n\n### 3.3 Link = `[[wikilink]]`\n\nOne syntax for page links, relations, transclusion, and block references:\n\n| Form | Meaning |\n| --- | --- |\n| `[[Q3 launch]]` | link to a page |\n| `[[people/adithya]]` | a relation value in frontmatter |\n| `[[Q3 launch#Risks]]` | link to a section |\n| `[[Q3 launch#^b7f2]]` | link to a specific block |\n| `![[Q3 launch#Risks]]` | **transclude** (Notion's synced block) |\n\nBacklinks are just the reverse index of this — computed, never authored.\n\n### 3.4 Index = a disposable cache\n\nA local SQLite index makes queries, backlinks, and search instant across thousands of files.\n\n> **It is a cache, not a second source of truth.** Delete it and Vedrix rebuilds it from the files. Nothing lives only in the index. This is what keeps \"markdown-first\" honest as the workspace scales — the alternative (re-parsing every file per keystroke) collapses at ~500 pages.\n\n---\n\n## 4. The four pillars\n\n### Pillar A — Blocks & page building\n\nNotion's editor feels good because of *structure you can manipulate*, not because of exotic block types.\n\n| Feature | Markdown representation | Notes |\n| --- | --- | --- |\n| Slash menu | — | **Ships today** |\n| Callouts | `> [!note]` | **Ships today** (GitHub-compatible) |\n| Toggle / collapsible | `<details><summary>` | Valid MD; renders everywhere |\n| Columns | `::: columns` fenced directive | Degrades to stacked content |\n| Block handles (drag, ⋮⋮) | — | Partly ships (drag-reorder exists) |\n| Block IDs | `^b7f2` trailing anchor | Obsidian-compatible |\n| Synced blocks | `![[page#^id]]` transclusion | Renders live; source is one file |\n| Templates | `.md` files in `_templates/` | A template *is* a page |\n| Database inline in a page | ` ```vedrix-view ` fenced block | Embeds a saved view |\n\n**Design stance:** every Notion-specific block must degrade to something a human can read in a plain text editor. `<details>` and fenced directives pass; a proprietary JSON blob does not.\n\n### Pillar B — Databases & views\n\nThe centerpiece build. Five view types, one query engine.\n\n- **Table** — the spreadsheet grid; inline-editable cells writing back to frontmatter\n- **Board** — kanban grouped by any select property; drag = rewrite one frontmatter field\n- **Calendar** — grouped by a date property\n- **Gallery** — cards with a cover image (first image in the page, or a `cover:` key)\n- **List** — the minimal view; a filtered index\n\n**Property types:** text · number · select · multi-select · date · checkbox · URL · email · person · relation · rollup · formula · created/edited time.\n\n**The interaction that must feel perfect:** drag a card between board columns → the `status:` line in that file changes → the file is saved → the view re-renders. If that round-trip is instant and lossless, the whole product is credible. If it stutters or mangles frontmatter, nothing else matters.\n\n**Relations & rollups** — a relation is a `[[wikilink]]` in frontmatter; a rollup walks the relation and aggregates (`sum`, `count`, `latest`). Both computed from files at query time.\n\n**Formulas** — a small, *sandboxed* expression language (no arbitrary JS: it would execute untrusted content from files). Supports arithmetic, comparisons, dates, and a stdlib of ~30 functions. Deliberately closer to Notion 1.0 formulas than to a spreadsheet.\n\n### Pillar C — Wiki & knowledge\n\nWhere Vedrix can *beat* Notion, because a filesystem is already a tree.\n\n- **Page tree** — the folder tree becomes primary navigation; nesting is real directories\n- **Backlinks pane** — \"Linked mentions\" + \"Unlinked mentions\" (text matches on the page title)\n- **Graph view** — **ships today**; upgrade to use the real link index\n- **Quick find** — **ships today** (vault search); add page-title fuzzy jump (⌘P)\n- **Breadcrumbs** — from the file path, free\n- **Favorites / pinned** — sidecar\n- **Daily notes** — a dated page per day, `Journal/2026-08-01.md`, one shortcut away\n\n### Pillar D — Collaboration & sharing\n\nThe pillar where local-first forces real trade-offs. Handled by *tiering* rather than pretending.\n\n**Tier 1 — solo, ships naturally**\n- **Comments on blocks** — extend the existing annotations sidecar to anchor to block IDs\n- **Version history** — if the folder is a git repo, read history from git; otherwise periodic snapshots in `.vedrix/history/`. Timeline UI, diff view, restore.\n- **Publish to web** — export a folder as a static site. *This document is the proof it works.*\n\n**Tier 2 — async multi-user, via the user's own sync**\n- Files sync through Dropbox/iCloud/git — Vedrix stays out of it\n- Comments and presence are per-user sidecar files, merged on read (no write conflicts)\n- Conflict UI when two versions of a file diverge\n\n**Tier 3 — real-time multiplayer — deliberately deferred (see §7)**\n\n---\n\n## 5. Phasing\n\nEach phase ships something usable alone. No phase depends on a later one.\n\n| Phase | Theme | Headline capability | Rough size |\n| --- | --- | --- | --- |\n| **N1** | **Pages & properties** | Frontmatter property editor, page tree nav, `[[wikilinks]]` + backlinks, ⌘P quick-jump | M |\n| **N2** | **The index** | SQLite index + file watcher; instant search/backlinks at 10k pages | M |\n| **N3** | **Databases v1** | Folder-as-database, schema file, **table + board views**, filters/sorts/groups | L |\n| **N4** | **Blocks** | Toggles, columns, block IDs, transclusion, templates, inline database views | M |\n| **N5** | **Databases v2** | Relations, rollups, formulas, calendar + gallery views | L |\n| **N6** | **History & comments** | Git/snapshot timeline, restore, block comments | M |\n| **N7** | **Publish** | Folder → static site, themes, one-command deploy | S |\n| **N8** | **Workspace AI** | Ask across the whole vault; AI fills properties; AI builds views from a sentence | M |\n\n**Suggested first cut:** **N1 → N3.** Properties, links, and a working board view is the smallest set that makes someone say *\"this is my Notion now.\"* N2 slots in when the vault gets big enough to feel slow — which is a good problem.\n\n---\n\n## 6. What makes this *better* than Notion (the reasons to switch)\n\nParity alone never moves anyone. These are the wedges:\n\n1. **Instant.** No spinner, no page-load. Local files open in milliseconds — Notion's most common complaint.\n2. **Offline, always.** On a plane, in a basement, on bad hotel wifi.\n3. **Your files, forever.** No export ritual, no lock-in. It's already a folder.\n4. **One app for docs *and* PDFs, Word, slides, sheets.** Notion can't open your PDFs and annotate them; Vedrix already does.\n5. **A real canvas.** Excalidraw beats Notion's non-existent whiteboard.\n6. **AI over a vault you own**, with your own key — not a metered add-on.\n7. **Git-native.** Real version history, branches, and diffs for people who want it.\n\n---\n\n## 7. Honest limits (what we are *not* building, and why)\n\nNaming these up front is what keeps the plan trustworthy.\n\n| Not building | Why | What we do instead |\n| --- | --- | --- |\n| **Real-time multiplayer cursors** | Needs always-on servers + CRDTs; kills the local-first, no-account premise | Async collaboration via the user's own sync; revisit as an *optional* opt-in relay |\n| **Per-cell rich text in databases** | Frontmatter is structured data; rich text in a YAML cell isn't representable in plain text | Rich content lives in the page body, where it belongs |\n| **Notion's permission system** | Requires accounts + a server to enforce; file permissions are the OS's job | OS/folder permissions; per-share-link controls when publishing |\n| **Arbitrary JS formulas** | Executing expressions from files is a code-execution vector | Sandboxed expression language, ~30 functions |\n| **100% Notion import fidelity** | Notion exports lose block IDs and database relations | Best-effort importer, explicit report of what didn't survive |\n| **Web app / mobile parity on day one** | Desktop + Android is the current surface | Publish-to-web covers read-only sharing |\n\n---\n\n## 8. The risks worth watching\n\n- **Frontmatter round-trip fidelity.** Editing a property must never reorder keys, drop comments, or reformat a user's YAML. *Mitigation:* surgical line-level edits, never full-file re-serialization. **This is the single highest-risk mechanic in the plan** — if it corrupts one file, trust is gone.\n- **Index drift.** Files change outside the app. *Mitigation:* filesystem watcher + checksum on open; the index is always rebuildable.\n- **Scale.** 10k-page vaults must stay instant. *Mitigation:* N2 exists for exactly this; measure before optimizing.\n- **Scope gravity.** \"All of Notion\" is unbounded. *Mitigation:* the §7 list is a contract, and each phase must ship alone.\n- **Two products in one app.** A reader/annotator *and* a workspace. *Mitigation:* the workspace is what you get when you open a *folder*; opening a single file stays exactly as fast and simple as today.\n\n---\n\n## 9. Open questions\n\n1. **Does the folder tree become primary navigation**, or stay secondary to the current tabs-and-recents model?\n2. **Obsidian compatibility** — matching its `[[link]]`, `^block-id`, and frontmatter conventions makes vaults portable between both apps. Adopt as a hard compatibility target, or only as inspiration?\n3. **How opinionated should the schema file be?** One `_vedrix.db.yaml` per folder is simple; a single workspace-level config is tidier but less portable.\n4. **Is the daily-note / journal workflow in scope**, or is that a different product?\n5. **What is the Pro line?** If Vedrix is ever paid: sync relay, publish hosting, and AI credits are the natural candidates — all optional, none gating local use.\n\n---\n\n*This is an ideation, not a commitment. It is deliberately larger than the next release. See [ROADMAP](ROADMAP.md) for what is actually scheduled, and [PRD](PRD.md) for the shipped product's requirements.*\n"}, {"id": "ux-audit", "title": "UI / UX Audit", "group": "Design", "md": "# Vedrix — UI/UX Audit\n\n**Date:** 2026-07-06 · **Method:** hands-on testing (desktop 1280px + mobile 375px, cold start & loaded states) plus a full code-level antipattern scan of `index.html` / `app.js` / `app.css` / `themes.css`.\n\nSeverity: **C**ritical (feature broken/unreachable) · **H**igh (misleading or blocking) · **M**edium (friction/inconsistency) · **L**ow (polish).\n\n---\n\n## Critical — broken or unreachable functionality\n\n### C1. Projects are unusable on Android (hover-only affordances)\n`.proj-rowadd`, `.proj-rowmore` (app.css) are `opacity: 0` until `:hover`, and 20×20px. `.pd-x` (remove doc) is the same pattern. Touch devices have no hover — **verified opacity 0 on the mobile viewport**. The only fallbacks are right-click context menus, which don't exist on touch. Net effect: the entire add-file/edit/delete project flow we shipped is invisible on Android.\n**Fix:** on `body.mobile`, render these controls always-visible at reduced opacity with ≥40px hit areas (padding, not icon size); or move all row actions into a tap-to-open row menu.\n\n### C2. Translate uses `window.prompt()` (app.js:3610)\nNative prompt breaks the design language on desktop and **can be a silent no-op in Android WebView** — Translate would simply do nothing.\n**Fix:** small in-app input dialog (reuse the modal pattern), with recent-language chips.\n\n### C3. Destructive actions have zero confirmation\n\"Delete project\" (also deletes all its file assignments) and \"Clear history\" execute instantly with no confirm and no undo. One mis-tap = silent data loss — worse on mobile where mis-taps are common (and the ⋯ menu items sit next to each other).\n**Fix:** design-consistent confirm step for Delete project, and an \"Undo\" toast for both (keep the data for ~8s before committing).\n\n---\n\n## High — misleading or blocking UX\n\n### H1. Mac-isms shown on Android\n- Search chip renders a **⌘K** badge on touch (verified at 375px).\n- All tooltips embed ⌘ shortcuts (`title=\"Toggle sidebar (⌘B)\"` etc.).\n- AI error says *\"add one in Settings (⌘,)\"*.\n- AI settings note says *\"Stored only on this Mac\"*.\n**Fix:** platform-aware strings — hide `.kbd` hints and ⌘ text under `body.mobile`; \"this device\" instead of \"this Mac\".\n\n### H2. AI panel is a dead end without an API key\nYou can open the panel, type a full question, hit send — and only then learn via a plain-text info line that there's no key. The error is not actionable (no button), and its hint is a Mac shortcut.\n**Fix:** when no key is configured, the panel shows a setup card (\"Connect an AI provider\" → button that opens Settings pre-navigated to the AI section via `showSettingsSection('ai')`). Make error rows carry an action button.\n\n### H3. Context bar collides at mobile widths\nAt 375px the Read/Edit segment overlaps and clips (\"Ed…\"), and the meta text wraps awkwardly (verified in screenshot).\n**Fix:** mobile layout for `#context-bar` — drop the word-count meta, keep path + Read/Edit + Saved; let the segment shrink gracefully.\n\n### H4. Cold-start (first-run) screen is off-design and passive\nThe very first screen a new user sees: 📄 emoji, \"Vedrix\", and \"press ⌘O\" / \"Tap ＋ above\" — no button, no drop-zone affordance, none of the design language. It's the weakest surface in the app and it's the first impression.\n**Fix:** first-run version of the designed Home — brand tile, a real **Open a file** button, \"or drop a file anywhere\" hint, optional \"Open sample document\".\n\n### H5. Mobile/desktop mode is frozen at load\n`body.mobile` is computed once. Resizing a desktop window across the breakpoint (verified: 800→1280px) leaves the app in the wrong mode — mobile toolbar, drawer sidebar — until reload.\n**Fix:** listen on `mobileMQ` `change` and re-run the mode application + `updateSidebar()`.\n\n### H6. Accessibility baseline missing\n- 47+ icon-only buttons have `title` but **no `aria-label`** (TalkBack/VoiceOver users get nothing).\n- No `:focus-visible` styles — keyboard users can't see where they are.\n- Modals (settings, project, export, palette) don't trap focus and don't restore it on close.\n**Fix:** one a11y pass: `aria-label` on every icon button, a global `:focus-visible` outline, minimal focus trap + restore in the modal helper.\n\n### H7. Strikethrough silently fails (demo + editor round-trip)\nThe demo doc's `~strikethrough~` renders as literal tildes (markdown-it needs `~~`). Verified: no `<del>`/`<s>` in the rendered demo.\n**Fix:** correct the demo to `~~…~~`; confirm the editor's Strike command emits `~~`; optionally enable single-tilde.\n\n---\n\n## Medium — friction and inconsistency\n\n| # | Finding | Detail | Fix |\n|---|---|---|---|\n| M1 | Touch targets under 40px | tab close 18×18, project buttons 20×20, findbar buttons 24px, stepper 26px | mobile sizing pass — pad hit areas to ≥40px |\n| M2 | Settings save on `change` only | typing an API key then closing the modal (Esc / backdrop) can discard the value before blur fires | switch text inputs to `input` events |\n| M3 | Inconsistent menu/dialog behavior | some close on `mousedown`-outside, some on `click`; Enter-key semantics vary across inputs | standardize on one pattern (mousedown-outside + Esc; Enter submits) |\n| M4 | Empty states without actions | History: \"No files opened yet\"; Home \"Jump back in\" can render empty | add an \"Open a file\" action to each |\n| M5 | Silent failures | PDF page render errors → blank space; missing PDF text layer → Find silently finds nothing; `catch` blocks swallow | inline notice per failed page; one-time toast \"text search unavailable for this PDF\" |\n| M6 | Edit toolbar overflow (mobile) | 749px of tools in a 375px bar; scrolls but no affordance | edge-fade gradient + momentum scroll |\n| M7 | Scroll position not restored | recents store a position but reopening a file lands at top | apply saved position on open |\n| M8 | localStorage quota unhandled | library/settings writes can throw (esp. Android WebView) and die silently | wrap in try/catch → toast |\n\n## Low — polish\n\n| # | Finding | Fix |\n|---|---|---|\n| L1 | `--text-muted` contrast is borderline in some themes; labels at 10.5px | contrast check per theme; floor at 11.5px |\n| L2 | `⌘O` kbd renders ambiguously (reads as \"⌘0\" in the mono font) | spell it out or use a font variant |\n| L3 | Tabs truncate hard at mobile (\"de…\") with min-width 96px | tighter min-width + middle-ellipsis |\n| L4 | \"Search\" chip actually opens the command palette | label it \"Search & commands\" on desktop |\n\n---\n\n## Addendum (2026-07-06) — icon & control duplication ✅ FIXED\n\nUser-reported after the initial audit, which missed this category entirely. Verified by a programmatic glyph inventory (hash every visible chrome button's SVG, group duplicates):\n\n| Finding | Fix |\n|---|---|\n| **Settings appeared twice** (topbar + rail bottom) with an icon that reads as a *sun*, not a gear | Topbar `#settings-btn` removed — the rail owns it (mobile: overflow menu). Icon replaced with an unambiguous sliders glyph |\n| **History appeared twice** (topbar clock + rail clock) | Topbar `#history-btn` removed; rail owns it. History panel re-anchored to open next to the rail trigger (was popping up top-right, far from its new button) |\n| **Edit pencil duplicated the Read/Edit segment** directly below it | Topbar `#edit-btn` removed; the context-bar segment is the single mode switch (⌘E still works) |\n| **Mind-map icon ≈ AI sparkle** (circle + 4 spokes reads as a 4-point star at 16px) | Replaced with a real mind-map glyph (root node + 3 branches) |\n| **Open (topbar) and Files (rail) shared the same folder glyph** for different actions | Rail Files → stacked-documents glyph |\n\nPost-fix inventory: **0 duplicate glyphs** across topbar / nav rail / context bar at both breakpoints.\n\n**Lesson recorded:** audits must include a control inventory pass (every icon, its meaning, its home — one function, one place, one glyph).\n\n## Addendum 2 (2026-07-06) — Export had no entry point ✅ FIXED\n\nUser-reported: \"you didn't add export.\" The cross-format export dialog (PDF/HTML/Markdown/CSV with theme + page options and live preview) was fully built — but its **only** trigger was the ⌘K command palette: undiscoverable on desktop, unreachable on Android (no keyboard). The inverse of the icon-duplication finding: a function with **zero** homes.\n\n| Fix | Detail |\n|---|---|\n| Topbar Export button | download-tray icon in the doc-actions cluster, visible whenever a document is open (desktop) |\n| Overflow-menu \"Export…\" | mobile path, shown when a document is open |\n| CSV format tile added | the CSV handler existed but was never listed — spreadsheets now default to it |\n| Per-kind format filtering | formats that don't apply to the open document are omitted instead of silently no-oping |\n| Silent returns → toasts | HTML-for-slides, CSV-for-non-sheets, empty extractions, and thrown errors all say so now |\n\n**Lesson:** the inventory pass must run both directions — every *control* needs one function, and every *function* needs at least one control.\n\n**Follow-up (same day):** entry points alone weren't enough — the user then found no real file was ever produced. Root cause: PDF (the default format) called `window.print()`, a **silent no-op in WKWebView**; the dialog closed and nothing happened (⌘P and the palette Print were equally dead). Fixed with a native `print_page` Rust command (real macOS print panel — \"Save as PDF\" lives there), an Android `save_export` fallback (no save dialog exists on mobile), truthful save results (cancelling no longer toasts \"Exported\"), and PDF hidden on Android. **Verified on the installed app by driving it on-screen: a real 24 KB .md landed on disk; the print panel opens.**\n\n**Lesson 2:** \"verified in the browser preview\" ≠ verified. Tauri-only paths (native dialogs, print, IPC) must be exercised in the real app — the browser's fallback (blob downloads) masks broken native paths.\n\n## Fix plan\n\n**Phase 1 — Touch & safety (critical path, do first)** ✅ **DONE 2026-07-06**\nC1 touch-visible project controls (always-visible, 34px on mobile) · C2 `prompt()` → in-app language dialog with chips · C3 undo-toast for Delete project & Clear history · H1 platform-aware copy (⌘K badge hidden on mobile, \"this device\") · H2 AI setup card + actionable error buttons deep-linking to Settings→AI · H3 context-bar mobile layout (meta hidden, no collision).\n\n**Phase 2 — First impressions & correctness** ✅ **DONE 2026-07-06**\nH4 first-run screen (brand tile, Open-a-file + Try-the-sample buttons, drop hint) · H5 re-verified: `applyMobile` + MQ change listener are correct; the earlier stuck-mode repro was a preview-tool artifact · H7 root-caused: turndown-gfm emits single-tilde `~text~` that markdown-it can't parse — edit round-trips silently un-struck text; fixed with a `~~` rule override · M1 touch targets (tab close 18→28px, findbar 24→38px, stepper 26→38px, seg/swatches bumped) · M2 settings text inputs save on `input` (closing the modal can no longer discard an API key) · M4 History and Home empty states got \"Open a file\" actions.\n**Bonus finding while testing:** phantom toolbar buttons on cold start — `.icon-btn { display:flex }` was overriding the `hidden` attribute (visible in every cold-start screenshot; pre-existing). Fixed globally with `[hidden] { display:none !important }`.\n\n**Phase 3 — Quality & a11y** ✅ **DONE 2026-07-06**\nH6: every icon button now gets `aria-label` (mirrored from `title`, shortcut hints stripped; a MutationObserver labels dynamically created buttons too) · global `:focus-visible` accent outline · modal focus management (focus moves into the dialog, Tab is trapped inside, focus restores to the trigger on close — verified for settings/project/lang/export/shortcuts/palette) · M5: PDF page render failures show an inline \"Page N failed to render\" notice; scanned PDFs without a text layer warn once when Find opens · M8: all localStorage writes routed through a quota-safe `lsSet` (toasts at most once/min instead of dying silently) · M7: scroll restore now retries until progressive content (PDF pages) is tall enough to hold the position · L1: sub-11px labels bumped to ≥11px.\n\n**All three phases complete.** Remaining niceties (not scheduled): M3 menu close-pattern unification, M6 toolbar scroll fade, L2–L4.\n\nEach phase is independently shippable (build + install + APK + push).\n"}, {"id": "plan-design-implementation", "title": "Plan · Design Handoff", "group": "Design", "md": "# Plan — Implementing the Design Handoff\n\n*Drafted 2026-07-05. Source: `Modern markdown editor app.zip` →\n`design_handoff_sutra/` (README spec + `Vedrix Prototype.dc.html` interactive +\n`Aurora Editor.dc.html` comps). Status: awaiting go / decisions.*\n\n---\n\n## 1. What the handoff is\n\nA **high-fidelity redesign of the entire app** plus several **net-new\nsurfaces**, delivered as HTML design references (not production code). The\nREADME is a near-complete spec: exact tokens, fonts, icon paths, spacing,\nmotion, and per-screen behavior. It explicitly says: **recreate inside Vedrix's\nexisting CSS-variable environment — no new framework, map hexes to theme\nvariables.** This is a **re-skin + additions of the working app**, not a rewrite.\nAll current functionality is preserved.\n\n## 2. Two buckets of work\n\n**A. Visual system (re-skin everything that already exists):**\n- New fonts: **Hanken Grotesk** (UI/body), **Newsreader** (reading headings /\n  serif), **Geist Mono** (code, badges, kbd). Bundle locally for offline.\n- Expanded tokens per theme: add `--panel2`, `--accent-fg`, `--code-bg`,\n  `--card` to all 10 themes (spec gives Sepia + One Dark; derive the other 8).\n- **Icon set**: one stroke family (24×24, `stroke-width 1.6`, `currentColor`,\n  no emoji). Replace today's emoji/unicode glyphs. AI sparkle is the only filled\n  icon.\n- Re-skin: topbar, **context bar** (new: path · mode segmented · read-time ·\n  Saved), tabs (format badges, LIVE pill, dirty dot), sidebar (Contents/Files\n  sub-tabs, reading-progress bar, \"Ask about this doc\" card), reader typography,\n  editor toolbar, selection bubble, slash menu, AI panel, settings, toasts.\n- Format badges (MD/HTML/PDF/DOC/PPT/XLS/TXT rounded squares, mono label).\n\n**B. Net-new features/surfaces:**\n1. **Command palette (⌘K)** — action search + theme switch. Self-contained.\n2. **Projects & grouping** — color+icon projects, tags; sidebar Projects group;\n   new-project modal; tab underlines; persistence in local app-data sidecar\n   keyed by file path (never in the .md). *Model resolved by design: Projects =\n   primary (folder-like, ~1/doc), Tags = cross-cutting labels.*\n3. **Home / Projects dashboard** — 64px nav rail + greeting, project cards,\n   \"jump back in\" recents, AI quick-actions, import rows, activity feed. A new\n   *entry point* (app becomes home-or-document, not document-only).\n4. **Export dialog** — format list (incl. DOCX/PPTX/PNG/EPUB, pandoc-tagged) +\n   options + live preview. Replaces today's flat export menu.\n5. **PPTX presentation mode** — full-screen presenter (current+next slide,\n   notes, timer, progress dots, ←/→).\n6. Reading-progress + scroll-sync polish; quick-action chips; AI streaming\n   states with Insert-as-note/Copy.\n\n## 3. Decisions needed before/within build\n\n1. **Collaborator avatars (MK/JD/+3 in the topbar).** Vedrix is local-first,\n   single-user; there is **no collaboration backend**. Options: (a) omit them\n   (most honest), (b) render as a static \"Share\" affordance stub for visual\n   parity. **Recommendation: omit for now**, revisit if real sharing is ever a\n   product goal. *Need your call.*\n2. **Home dashboard changes the app's entry model.** Today Vedrix opens straight\n   into a document/empty state. The design adds a Home with a nav rail. Confirm\n   we want Home as a first-class screen (recommended — it's where Projects\n   live) vs. keeping document-first with Projects only in the sidebar.\n3. **Other 8 themes' new tokens** — I'll derive `--panel2/--card/--code-bg/\n   --accent-fg` for the 8 themes the spec didn't enumerate, matching its method\n   (panel2 ≈ slightly-lifted panel, card ≈ raised bg, code-bg ≈ tinted bg,\n   accent-fg = readable-on-accent). Flag any you want to hand-tune.\n4. **Fonts bundled locally** (offline requirement) → ~300–500KB of woff2 added\n   to `src/vendor/fonts/`. Fine, just noting the size.\n5. **Scope is multi-day.** Phased below; each phase ships independently.\n\n## 4. Phased implementation\n\nOrdered so the app *looks* redesigned ASAP, then gains the new surfaces. Each\nphase = build → verify in preview → build both platforms → install → push.\n\n### D1 — Visual foundation *(biggest visual ROI; no new data model)*\nFonts + expanded tokens (all 10 themes) + icon set + re-skin every existing\nsurface (topbar, context bar, tabs, sidebar, reader type, editor toolbar,\nbubble, slash, AI panel, settings, toasts, format badges). After D1 the app\n*is* the redesign visually, with today's feature set.\n\n### D2 — Command palette (⌘K)\nOverlay, fuzzy action list, theme switcher, keyboard nav. Wire to existing\ncommands (new doc, mode toggle, edit, AI, summarize, mind map, export, themes).\n\n### D3 — Projects & grouping (data + UI)\nLocal sidecar store (JSON/SQLite keyed by path) for projects+tags; Rust\ncommands to read/write it; sidebar Projects group; new-project modal\n(color/icon); right-click Add-to-project / tag; tab underline; mind-map/graph\nnode tinting by project color.\n\n### D4 — Home / Projects dash
