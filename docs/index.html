board\nNav rail + home screen (greeting, project cards, recents, quick-actions, import\nrows, activity). Routing between Home and document view. Depends on D3.\n\n### D5 — Export dialog + PPTX presentation mode\nRich export modal (format+options+preview; DOCX/PPTX/PNG/EPUB via libs/pandoc\nsidecar where needed); PPTX presenter mode (full-screen slideshow).\n\n**Continuous:** mobile parity for each surface (drawer, bottom nav, sheets,\nsafe-areas already exist — extend to new surfaces); round-trip + regression\nchecks; keep all existing shortcuts/behaviors.\n\n## 5. Risks & mitigations\n\n| Risk | Mitigation |\n|---|---|\n| Re-skin breaks existing behavior | Re-skin CSS/markup surface-by-surface; verify each in preview before moving on; keep JS logic intact |\n| 10 themes × new tokens = drift | Derive tokens programmatically from existing per-theme values; visual-check a light + a dark theme per phase |\n| Fonts hurt first-paint / offline | Bundle woff2 locally, `font-display:swap`, subset if needed |\n| Home dashboard scope creep | Ship D4 behind the nav rail; Projects (D3) is usable in the sidebar even without Home |\n| Collaboration implied but absent | Decision #1 — omit avatars; don't imply features we don't have |\n| Icon swap misses a spot | Central `icon()` map (as the prototype does) so every glyph comes from one source |\n\n## 6. Recommendation\n\nStart with **D1 (visual foundation)** — it transforms how the whole app looks and\nfeels using only re-skin work, no risky new data model, and everything after\nsits on it. Then D2 (palette, quick), D3 (projects), D4 (home), D5 (export +\npresent).\n\n**Open the two decisions in §3 (collaborator avatars; Home as a first-class\nscreen), then greenlight D1.**\n"}, {"id": "plan-interactive-html-and-editor", "title": "Plan · Interactive HTML + Editor", "group": "Engineering", "md": "# Plan — Interactive HTML + Full Editor\n\n_Drafted 2026-07-04. Status: awaiting approval._\n\n* * *\n\n# Part 1 — Interactive HTML (prototypes, dashboards, full sites)\n\n## Problem\n\nHTML currently renders in a script-stripped sandbox: perfect for _reading_ an HTML document, useless for a Chart.js dashboard, a website prototype, or anything interactive — they render blank or dead. The user expectation is “double-click my prototype → it works.”\n\n## Design: two modes per HTML tab\n\n|  | **Interactive** (new, default) | **Reader** (current behavior) |\n| --- | --- | --- |\n| Scripts | ✅ run | ❌ stripped |\n| Page CSS | ✅ | ✅ |\n| Relative assets (`./app.js`, `./style.css`, images) | ✅ real files load | images only |\n| Vedrix TOC / ⌘F / export / mind map | ❌ (isolated) | ✅ |\n| Isolation | full cross-origin | sandboxed, no scripts |\n\nA toggle on the tab (like the PDF “Aa”) switches modes; per-tab choice remembered. Reader is the fallback when a page fails or you just want to read.\n\n## How Interactive mode works\n\n-   **Desktop/Android:** `iframe.src = convertFileSrc(path)` — the file loads as a real URL over the asset protocol. Consequences, all good:\n    -   relative `<script src>`, `<link href>`, images, fonts, even multi-file site folders resolve from disk → **full prototypes work**, not just single files\n    -   the asset origin (`asset://` / `http://asset.localhost`) is **cross-origin from the app**, so page JS cannot touch Vedrix’s DOM, settings, or Tauri IPC — isolation comes from the browser’s own origin model, not from us sanitizing anything\n-   The frame fills the pane and owns its scrolling (dashboards manage their own layout); Vedrix’s scroll-thumb and reader width are disabled for this mode.\n-   `fetch()`/XHR from the page to external APIs works (dashboards often need live data). Local-first purists can stay in Reader mode.\n-   **Browser dev mode:** `srcdoc` + `sandbox=\"allow-scripts\"` (opaque origin — never combined with `allow-same-origin`); relative assets unavailable there./\n\n## Security model (explicit)\n\n-   Interactive pages run JS **in an isolated origin**: no access to Vedrix’s window, localStorage, or IPC. Verify during implementation that `__TAURI__` is not injected into cross-origin frames (test + assert in a diag).\n-   `target=_blank` / external links from the frame → open in the system browser, never inside Vedrix.\n-   Never `allow-same-origin` + `allow-scripts` together on srcdoc (that combo would let the page reach the parent).\n\n## Work items (≈ half a day)\n\n1.  `renderHtmlDoc` gains mode branch (`t.htmlMode: 'live' | 'reader'`).\n2.  Toggle button + per-tab persistence; Reader keeps today’s TOC/find path.\n3.  Frame-fills-pane layout mode (`#scroller` overflow off for live HTML).\n4.  Link/nav policy: intercept top-level navigations out of the frame.\n5.  IPC-exposure test on all three platforms (desktop, Android, browser).\n6.  Samples: `samples/demo-dashboard.html` (Chart.js-style inline JS) to prove it.\n\n* * *\n\n# Part 2 — Full editor (Notion-grade, phased)\n\n## The core constraint to decide up front\n\nVedrix stores documents as **markdown**. Markdown can express: headings, bold/italic/strike, inline & block code, links, images, lists, task lists, tables, quotes, dividers, math, mermaid. Markdown **cannot** express: per-character fonts/sizes/colors, alignment, columns, callout backgrounds.\n\n**Decision (recommended):** stay markdown-first.\n\n-   Everything markdown-expressible gets first-class editing UI.\n-   _Document-level_ appearance (font family, size, width) stays in Settings — surfaced compactly in the edit toolbar as an “Aa” popover (this is what the “fonts / size” ask maps to without breaking files).\n-   _Per-selection_ color/highlight ships later as **opt-in “rich extras”** persisted as inline HTML spans inside the markdown (valid md; renders everywhere in Vedrix; degrades gracefully in other editors). Toggle in Settings, default off.\n\nAlternative considered and rejected: adopting a prebuilt editor (Toast UI / TipTap). Rejected because: TipTap/ProseMirror requires a bundler (breaks the no-build architecture), Toast UI imposes its own look (breaks the “reading and editing look identical” identity) and its md dialect fights our pipeline (mermaid/KaTeX/typographer). We keep the contenteditable engine we already shipped and grow a command layer on it.\n\n## Architecture\n\n```\n┌──────────────── Edit session ────────────────┐\n│ contenteditable #content (rendered view)     │\n│   ▲ commands            ▲ history            │\n│ CommandLayer          HistoryStack           │\n│  toggleMark(bold…)     snapshot(innerHTML +  │\n│  setBlock(h1/quote…)    selection bookmark)  │\n│  insert(table/task/…)   undo/redo ⌘Z/⇧⌘Z     │\n│   ▲            ▲            ▲                │\n│ Toolbar   SelectionBubble  SlashMenu (\"/\")   │\n└───────── richToMarkdown() on save ───────────┘\n```\n\n-   **CommandLayer**: each op is a small DOM transform on the current Selection/Range (with `execCommand` used where it’s still reliable: bold/italic/lists). Every op ends with a _normalize pass_ that guarantees the DOM stays markdown-convertible.\n-   **HistoryStack (undo/redo)**: native contenteditable undo breaks the moment we mutate DOM programmatically — so we own history: snapshot on every command + debounced typing snapshots; selection restored via bookmark markers; depth 200. ⌘Z / ⇧⌘Z (and toolbar buttons).\n-   **Round-trip safety net**: golden-file tests — `samples/roundtrip.md` containing every construct; edit-mode enter→exit must preserve it. Run in preview on every editor change.\n\n## Phases\n\n### E1 — Toolbar + undo/redo (~1 day) ← the visible leap\n\nFixed toolbar appears under the topbar in edit mode:\n\n`↶ ↷ │ [Paragraph ▾] │ B I S <> │ 🔗 │ • 1. ☑ │ ❝ ─ │ ⊞ 🖼 ∑ ⤳ │ Aa`\n\n-   Undo / redo (HistoryStack)\n-   Block dropdown: Paragraph, H1–H4, Quote, Code block, Bullet / Numbered / To-do list\n-   Marks: bold, italic, strike, inline code; link add/edit (mini popover)\n-   Insert: table (3×3), image (file picker → relative path), divider, math block, mermaid block\n-   To-do: checkbox insertion + click-to-toggle (already works) + toolbar entry\n-   “Aa” popover: document font, size, width (bridges to Settings)\n-   Mobile: same toolbar, horizontally scrollable, docked above the keyboard (visualViewport API)\n\n### E2 — Notion feel (~1 day)\n\n-   **Selection bubble**: floating mini-toolbar (B I S code link + block menu) on text selection — the Notion signature interaction\n-   **Slash menu**: typing `/` opens a searchable block palette (Heading 2, To-do, Table, Mermaid, Math, Divider…) inserted at the caret\n-   **Markdown autoformat while typing**: `#` → H1, `-` → bullet, `[]` → to-do, ` ``` ` → code block, `>` → quote (the “it just knows” feel)\n\n### E3 — Power editing (~1–2 days)\n\n-   Table editing grips: add/remove row/column, header toggle (hover controls)\n-   Block drag-handles to reorder paragraphs/blocks (Notion’s ⠿)\n-   Toggle blocks via `<details>` (md-legal, renders collapsed)\n-   Callouts (styled blockquote convention: `> [!note]` — GitHub-flavored)\n-   Opt-in rich extras: text color / highlight persisted as inline HTML\n-   Find & replace in edit mode\n\n### Deliberately out (for now)\n\nReal-time collaboration, comments, per-block databases — different product.\n\n## Risks & mitigations\n\n| Risk | Mitigation |\n| --- | --- |\n| contenteditable quirks differ per WebView (WK vs Blink vs Android) | command layer avoids exotic APIs; test matrix = mac app + Android emulator + preview |\n| Turndown loses an edge case | golden-file round-trip test gate on every editor PR |\n| Selection lost across programmatic edits | bookmark-marker technique (insert sentinel spans, restore, remove) |\n| Toolbar crowds small screens | priority+overflow design; bubble/slash carry most weight on mobile |\n\n## Suggested execution order\n\n1.  **Part 1 (Interactive HTML)** — small, unblocks your prototypes/dashboards immediately.\n2.  **E1 toolbar+undo** — the biggest visible editor jump.\n3.  **E2 bubble+slash+autoformat** — the “feels like Notion” moment.\n4.  **E3** — power features, can trail.\n\nTotal: ~3–4 working days for the full plan; each step ships independently."}, {"id": "plan-canvas-freeform", "title": "Plan · Freeform Canvas", "group": "Engineering", "md": "# Plan — Freeform Canvas (Miro/Excalidraw-style)\n\n**Decision (2026-07-10):** Hybrid — embed **Excalidraw** (MIT) for the full toolset now, theme it to Vedrix, and layer Vedrix-native integration on top over phases.\n\n## Why Excalidraw\n- **MIT licensed** — free for commercial/offline/self-host, no watermark, no license key. (tldraw disqualified: React-only + production license key + \"made with tldraw\" watermark unless paid.)\n- **Is the OSS Miro/FigJam**: freehand, shapes, arrows/connectors, text, frames, images, element library, laser pointer, PNG/SVG export, excellent **touch/pen** support (matters for the Android build).\n- **`.excalidraw` JSON** open format → interop with excalidraw.com.\n- Fully offline-capable (fonts self-hosted via `window.EXCALIDRAW_ASSET_PATH`).\n\n## The one constraint we design around\nVedrix's frontend has **no bundler** — libs are prebuilt files in `src/vendor/` loaded via `<script>`. Excalidraw is now ESM + React. So React lives **only inside the canvas view**, isolated behind a vanilla bridge, and is introduced via a **build-time-once** step (not the app runtime):\n\n### Vendor build step — `tools/build-canvas.mjs`\nRun once (and on Excalidraw upgrades), NOT part of `tauri build`:\n1. `npm i -D esbuild react react-dom @excalidraw/excalidraw` (in a `tools/` workspace, kept out of the app).\n2. A thin adapter `tools/canvas-host.jsx` mounts `<Excalidraw>` and exposes an imperative API on `window.SutraCanvas`.\n3. esbuild bundles **React + ReactDOM + Excalidraw + adapter → `src/vendor/excalidraw.bundle.js`** as an IIFE (React bundled in — avoids the dead UMD path). ~2 MB, consistent with mermaid's 2.6 MB.\n4. Copy Excalidraw fonts → `src/vendor/excalidraw-assets/`; the bundle sets `window.EXCALIDRAW_ASSET_PATH` to that local path.\n- esbuild 0.28.1 + Node 24 already present. ✅\n\n### The bridge (keeps app.js vanilla)\n`window.SutraCanvas = {`\n- `mount(containerEl, sceneData, { onChange, theme })` — create/attach the React root once\n- `load(sceneData)` · `getScene()` · `setTheme('light'|'dark')`\n- `exportPNG()` · `exportSVG()` · `destroy()`\n`}`\napp.js never imports React; it calls these.\n\n## Data model & storage\n- New doc **kind: `canvas`**; files stored as **`.excalidraw`** JSON (interop) — extend `kindOf()` (app.js:215) and `badgeFor()`/`FORMAT_BADGE` (244) with a canvas badge + icon (`svgIcon` 2304).\n- Canvas files flow through the existing tab/file model: `makeTab` (1635), `addTab` (342), and thus appear in **Files, Projects, recents, Home** automatically.\n- **Autosave** like the editor: Excalidraw `onChange` (debounced ~800ms) → `getScene()` → write to the tab's file (`write_file` / `saveTextAs`); reuse the \"Saved/Unsaved\" context-bar state.\n\n## View & chrome\n- New full-screen pane **`#canvasview`** (sibling of `#scroller`/`#mapview`/`#graphview`), toggled by `showPane` (362) / `renderActive` (990). React root mounts once into it; scene swaps per active canvas tab.\n- Topbar/context-bar stay Vedrix; the toolbar inside is Excalidraw's (themed).\n- **Theme sync**: pass Excalidraw's `theme` prop from Vedrix's light/dark; override its CSS custom properties for accent/surCSS to move toward the Vedrix palette (honest limit: it will still read as Excalidraw, not pixel-match Vedrix).\n\n## Entry points (every function needs a control — audit lesson)\n- Nav rail: **\"New canvas\"** item (or fold into a New menu).\n- Home: a \"New canvas\" card next to \"New document\".\n- Tab `+` and Command palette (`⌘K`): \"New canvas\".\n- Open existing `.excalidraw` via the normal file picker (`openViaPicker` 1733).\n\n## Export\n- Reuse the **export dialog**: canvas → **PNG**, **SVG**, **`.excalidraw`**. PDF via canvas→PNG→existing print path. (Font/theme/margin controls N/A for canvas; dialog already filters per-kind via `when(t)`.)\n\n## Phasing (each independently shippable + verified in the real app)\n- **Phase A — Standalone canvas works.** Vendor build; `#canvasview` + bridge; create/draw/save/reopen/export a `.excalidraw`; light/dark theme sync. *Verify: draw → save → reopen → PNG export, on macOS.*\n  - **DONE & VERIFIED (2026-07-13, v142):** vendor build (`tools/build-canvas.mjs` → `vendor/excalidraw.bundle.{js,css}` 8.4 MB + 560 KB fonts; React 19.2 + Excalidraw 0.18.1 → IIFE). Bridge `window.SutraCanvas` (mount/load/getScene/setTheme/exportPNG/exportSVG/destroy). Wired: kind `canvas` (`.excalidraw`/`.canvas`), CNV badge, `#canvasview` pane, lazy-load on first open, autosave-to-path + ⌘S Save-As, theme sync, entry points (⌘K \"New canvas\", Home \"＋ New canvas\").\n    - **Verified in real WKWebView (macOS):** Excalidraw renders with full toolbar; dark theme auto-synced; canvas tab shows CNV badge + Vedrix chrome preserved. (Synthetic mouse-drag doesn't register as a draw stroke — automation limit, not an app bug; click-driven panels all work, so a real pointer draws fine.)\n    - **Data path verified (browser):** newCanvas→canvas tab+pane→lazy mount→inject element→getScene serialize (529 B)→parseScene round-trip = the exact save/reopen logic. ✓\n    - Fonts trimmed 13 MB→560 KB (dropped Xiaolai CJK; build now excludes it).\n    - **Remaining for a \"complete\" Phase A:** confirm a real hand-drawn stroke persists across save→reopen with a human (or non-synthetic) pointer; wire canvas into the **export dialog** (PNG/SVG/.excalidraw) — currently ⌘S saves `.excalidraw` only.\n  - **Phase A gaps CLOSED + extras (2026-07-13, local build, NOT pushed):**\n    - **Export dialog** now canvas-aware: PNG (via `SutraCanvas.exportPNG`, new Rust `write_bytes` for binary) / SVG / editable `.excalidraw`; doc formats hidden for canvas. Verified: dialog shows the 3 formats; exportPNG returns a valid 13 KB PNG (magic bytes ok), exportSVG valid — in browser. write_bytes compiles; disk-write itself is the only unexercised (trivial) link.\n    - **Reopen bug fixed:** `loadTauriContent`/`openBrowserFile` read `.excalidraw` as TEXT (was bytes → blank on reopen); file-picker filters + `<input accept>` include `excalidraw`/`canvas`.\n    - **NEW — background patterns:** custom `.sutra-cbg` layer behind Excalidraw (viewBackgroundColor transparent), synced to pan/zoom via onChange. None / Grid / Dots. Renders crisply in real WKWebView. New canvases default to Dots (blankScene appState.sutraBackground). Saved in the file.\n    - **NEW — Canva-style colour strip:** `#canvas-controls` bottom-center bar with the None/Grid/Dots segment + 14 swatches + custom-colour picker; `SutraCanvas.setStrokeColor/setFillColor` apply to selection and to the next element.\n    - Bridge additions: setBackground/getBackground, setStrokeColor, setFillColor; exports use a solid bg (transparent-on-screen would export blank).\n- **Phase B — Vedrix glue.** Canvas kind in Files/Projects/recents/Home with badge; New-canvas entry points; export-dialog wiring; Android WebView smoke test (touch/pen). *Verify: canvas shows in Projects; touch works on device.*\n- **Phase C — Cross-linking (the hybrid payoff, incremental).** A canvas element links to / embeds a Vedrix document (open on click); \"Send to canvas\" from a doc; later: AI-panel awareness of the active canvas.\n  - **DONE (2026-07-13, local build, NOT pushed):**\n    - **Doc cards:** `SutraCanvas.addDocCard({name, link, color})` — rounded rect + bound label (via `convertToExcalidrawElements`), placed at the viewport centre (staggered), badge-coloured per doc kind, carrying a `sutra://open?path=…` link (label inherits it, so the whole card is clickable).\n    - **Click-to-open:** Excalidraw `onLinkOpen` → `window.SutraCanvasOnLink` → switches to the open tab or `openTauriPath`; real http links unaffected.\n    - **\"Send to canvas…\"** from the ⌘K palette and the tab context menu → chooser (existing canvases + \"New canvas\") → card added, canvas marked dirty + autosaved.\n    - **Verified programmatically (browser):** chooser lists canvases; new-canvas path creates rect+label with correct link; link survives serialize→parseScene (persists in the file); `SutraCanvasOnLink` returns to the doc tab; palette shows both commands. Real-app screen test intentionally skipped per user instruction.\n    - Later (unplanned): AI-panel awareness of the active canvas; drag-from-Files onto canvas.\n  - **Control-bar rework after user feedback (2026-07-13, local, NOT pushed):**\n    - User couldn't change a shape's background: the strip only ever set STROKE (machinery was fine — verified fill/stroke both apply to a selection). Added a **Fill | Stroke** mode segment (Fill default) + a transparent checkerboard swatch (\"no fill\").\n    - Bar is now **optional**: ✕ hides it, a small palette chip (bottom-right) brings it back; persisted as `settings.canvasBarHidden`.\n    - **Excalidraw control column moved to the RIGHT** (user preference): `.App-menu_top` mirrored via the rtl-grid trick; the properties island's JS-computed inline `left` overridden with stylesheet `!important` (`left:auto; right:12px`) — inline styles lose to author `!important`; hamburger dropdown pinned on-screen the same way. Verified: island fully on-screen at right (1212–1412 @1440w), dropdown on-screen, fill/transparent/stroke all apply, close/reopen persists.\n    - GOTCHA (browser eval): a timed-out javascript_tool eval KEEPS RUNNING in-page — its later clicks polluted the next eval's state (mode was left on 'stroke'). Re-check state before chaining evals.\n    - Bar-wrap fix (user screenshot: ✕ + divider orphaned on a second row): close button is now `position:absolute` at the bar's top-right corner (out of the flex flow, can never wrap); its divider removed; `.cc-swatches` wraps within its own group so narrow windows get [toggles row / swatch row] instead of ragged wrapping.\n\n## Risks & mitigations\n- **React 19 ESM → IIFE bundling**: mitigated by bundling React *into* the artifact via esbuild (tested standalone before wiring).\n- **WKWebView / Android WebView compatibility**: Excalidraw needs a modern webview; **smoke-test early** on both (esp. Android) before Phase B.\n- **Offline fonts**: vendor them + set asset path; verify no network calls (CSP is `null`, so nothing blocks — must self-check).\n- **Bundle size** (~2 MB): fine vs existing 9 MB vendor payload; lazy-load the bundle only when a canvas first opens so it never taxes normal doc reading.\n- **Design mismatch**: accept Excalidraw's look in Phase A/B; revisit theming depth if it grates.\n\n## Rough effort\nPhase A ≈ 1–2 focused days (mostly bundling + bridge glue). Phase B ≈ 1–2 days. Phase C incremental.\n"}, {"id": "building", "title": "Building & Release", "group": "Engineering", "md": "# Building Vedrix across platforms\n\nVedrix is one Tauri 2 codebase. The web frontend (`src/`) is identical everywhere; only packaging and a few platform shims differ.\n\n## Local macOS build (what we use now)\n\n```bash\nnpm install\nPATH=\"/opt/homebrew/opt/rustup/bin:$PATH\" npx tauri build --bundles app\nditto \"src-tauri/target/release/bundle/macos/Vedrix.app\" \"/Applications/Vedrix.app\"\n```\n\nNotes:\n\n-   `--bundles app` skips the DMG (DMG bundling drives Finder via AppleScript and fails in a headless shell). For a shareable DMG, run `npx tauri build` from a normal Terminal.\n-   macOS-only window chrome (overlay titlebar, hidden title) lives in `src-tauri/tauri.macos.conf.json`, merged over `tauri.conf.json` at build time.\n\n## Windows\n\n**You cannot build a Windows binary on macOS** — Tauri needs the Windows toolchain + WebView2. Two ways to get one:\n\n1.  **CI (recommended):** push a tag `vX.Y.Z`; the GitHub Actions workflow (`.github/workflows/release.yml`) builds macOS (arm+intel), Windows `.msi`, and Linux `.deb`/AppImage, and attaches them to a draft Release.\n    \n2.  **On a Windows machine:**\n    \n    ```powershell\n    # once: install Rust (rustup), Node, and WebView2 (preinstalled on Win 11)\n    npm install\n    npx tauri build          # produces an .msi + .exe (NSIS) installer\n    ```\n    \n\nWindows specifics already handled in code:\n\n-   Native window decorations (no overlay titlebar) — the traffic-light inset is gated to `body.mac` only.\n-   `open_externally` uses `cmd /C start` on Windows, `open` on macOS, `xdg-open` on Linux.\n-   File-open on launch comes via argv (already handled in `setup()`), not the macOS `RunEvent::Opened` Apple event.\n-   Diagnostics write to the OS temp dir (`std::env::temp_dir()`), not `/tmp`.\n\nSigning (to avoid SmartScreen warnings): set an OV/EV cert. Azure Trusted Signing is the cheapest path; wire its secrets into the workflow.\n\n## Android\n\n**The responsive mobile UI is done** — at ≤720px viewport width Vedrix switches to: a slide-in drawer sidebar (hamburger), a collapsed topbar with a `⋯` overflow menu, a full-screen AI sheet, 40px touch targets, and pinch-to-zoom on PDFs/slides. This activates automatically inside the Android webview.\n\nPrerequisites (this Mac currently has **Java 8 and no SDK** — all three needed):\n\n-   **JDK 17+** — `brew install openjdk@17` (Tauri’s Gradle needs 17, not 8).\n    \n-   **Android Studio** — installs the SDK + platform tools.\n    \n-   **Android SDK + NDK** — via Android Studio’s SDK Manager (NDK is under “SDK Tools”).\n    \n-   Env vars in your shell profile:\n    \n    ```bash\n    export JAVA_HOME=\"$(/usr/libexec/java_home -v 17)\"\n    export ANDROID_HOME=\"$HOME/Library/Android/sdk\"\n    export NDK_HOME=\"$ANDROID_HOME/ndk/<version>\"\n    ```\n    \n\nThen:\n\n```bash\nnpx tauri android init      # one-time; scaffolds gen/android\nnpx tauri android dev       # run on an emulator or USB device\nnpx tauri android build     # produces an .aab for Play ($25 one-time)\n```\n\nStill to do for a shippable Android app: file intake from the OS share sheet / document picker (Android doesn’t use file associations the way desktop does), and Play Store assets. The reading UI itself already works on a phone.\n\n## Product identity note\n\nApp name is **Vedrix** (bundle id `com.adithya.sutra` — kept so existing local data survives the rename) with a custom icon (a geometric \"V\" mark on Vedrix blue `#2f6bff`). Same identity carries across all platforms.\n\n## iOS\n\n```bash\nnpx tauri ios init          # one-time; needs Xcode\nnpx tauri ios dev\nnpx tauri ios build         # needs Apple Developer Program ($99/yr)\n```\n\n## Release checklist\n\n1.  Bump `version` in `src-tauri/tauri.conf.json` **and** the `?v=NNN` asset query in `src/index.html` (busts the WebView cache).\n2.  Commit, tag `vX.Y.Z`, push the tag.\n3.  CI builds all platforms → draft GitHub Release.\n4.  Add signing secrets to the repo so installers are trusted (see workflow env).\n5.  Publish the release.\n\n  \n\n-"}]</script>
<script>
(function(){
  "use strict";
  var DOCS = JSON.parse(document.getElementById('docs-json').textContent);

  /* ---------- tiny, safe markdown -> html ---------- */
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function slug(s){return s.toLowerCase().replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-');}
  function inline(s){
    var codes=[];
    s=s.replace(/`([^`]+)`/g,function(_,c){codes.push(c);return '␀'+(codes.length-1)+'␀';});
    s=esc(s);
    s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g,'<span class="imgref">$1</span>');
    s=s.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,function(_,t,u){
      var safe=/^(https?:|#|\/|mailto:)/i.test(u)?u:'#';
      return '<a href="'+safe+'"'+(safe.charAt(0)==='h'?' target="_blank" rel="noopener"':'')+'>'+t+'</a>';});
    s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');
    s=s.replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,'$1<em>$2</em>');
    s=s.replace(/(^|[^_\w])_([^_\s][^_]*?)_(?=[^\w]|$)/g,'$1<em>$2</em>');
    s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
    s=s.replace(/␀(\d+)␀/g,function(_,i){return '<code>'+esc(codes[+i])+'</code>';});
    return s;
  }
  function indentOf(l){var m=l.match(/^(\s*)/);return m[1].replace(/\t/g,'  ').length;}
  function render(src){
    var lines=src.replace(/\r\n?/g,'\n').split('\n'),out=[],i=0;
    function listBlock(base){
      var html='',stack=[];
      while(i<lines.length){
        var l=lines[i],m=l.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
        if(!m){ if(/^\s*$/.test(l)&&i+1<lines.length&&/^(\s*)([-*+]|\d+\.)\s+/.test(lines[i+1])){i++;continue;} break; }
        var ind=indentOf(l),ord=/\d/.test(m[2]),lvl=Math.floor((ind-base)/2);
        if(lvl<0)break;
        while(stack.length>lvl+1){html+=stack.pop().t==='ol'?'</ol>':'</ul>';}
        if(stack.length<lvl+1){var tag=ord?'ol':'ul';html+='<'+tag+'>';stack.push({t:tag});}
        else if(stack.length===lvl+1&&stack[lvl].t!==(ord?'ol':'ul')){html+=stack.pop().t==='ol'?'</ol>':'</ul>';var tg=ord?'ol':'ul';html+='<'+tg+'>';stack.push({t:tg});}
        html+='<li>'+inline(m[3]);
        i++;
        var cont=[];
        while(i<lines.length&&!/^\s*([-*+]|\d+\.)\s+/.test(lines[i])&&!/^\s*$/.test(lines[i])&&indentOf(lines[i])>=base+2){cont.push(lines[i].trim());i++;}
        if(cont.length)html+=' '+inline(cont.join(' '));
        html+='</li>';
      }
      while(stack.length)html+=stack.pop().t==='ol'?'</ol>':'</ul>';
      return html;
    }
    while(i<lines.length){
      var l=lines[i];
      if(/^\s*$/.test(l)){i++;continue;}
      var fence=l.match(/^\s*```(.*)$/);
      if(fence){i++;var buf=[];while(i<lines.length&&!/^\s*```\s*$/.test(lines[i])){buf.push(lines[i]);i++;}i++;
        out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');continue;}
      var h=l.match(/^(#{1,6})\s+(.*)$/);
      if(h){var lv=h[1].length,tx=h[2].replace(/\s+#+\s*$/,'');out.push('<h'+lv+' id="'+slug(tx)+'">'+inline(tx)+'</h'+lv+'>');i++;continue;}
      if(/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(l)){out.push('<hr>');i++;continue;}
      if(/^\s*>/.test(l)){var q=[];while(i<lines.length&&/^\s*>/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,''));i++;}
        out.push('<blockquote>'+render(q.join('\n'))+'</blockquote>');continue;}
      if(/^\s*\|(.+)\|\s*$/.test(l)&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])&&lines[i+1].indexOf('-')>-1){
        var head=l.trim().replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim();});
        i+=2;var rows=[];
        while(i<lines.length&&/^\s*\|(.+)\|\s*$/.test(lines[i])){rows.push(lines[i].trim().replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim();}));i++;}
        var t='<div class="tw"><table><thead><tr>'+head.map(function(c){return '<th>'+inline(c)+'</th>';}).join('')+'</tr></thead><tbody>';
        t+=rows.map(function(r){return '<tr>'+head.map(function(_,ci){return '<td>'+inline(r[ci]||'')+'</td>';}).join('')+'</tr>';}).join('');
        out.push(t+'</tbody></table></div>');continue;}
      if(/^\s*([-*+]|\d+\.)\s+/.test(l)){out.push(listBlock(indentOf(l)));continue;}
      var para=[];while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#{1,6})\s/.test(lines[i])&&!/^\s*>/.test(lines[i])&&!/^\s*```/.test(lines[i])&&!/^\s*([-*+]|\d+\.)\s+/.test(lines[i])&&!/^\s*([-*_])\s*\1\s*\1/.test(lines[i])){para.push(lines[i].trim());i++;}
      if(para.length)out.push('<p>'+inline(para.join(' '))+'</p>');
    }
    return out.join('\n');
  }

  /* ---------- build nav ---------- */
  var nav=document.getElementById('nav'),groups=[];
  DOCS.forEach(function(d,idx){d.i=idx;var g=groups.filter(function(x){return x.name===d.group;})[0];
    if(!g){g={name:d.group,items:[]};groups.push(g);}g.items.push(d);});
  var num=0;
  groups.forEach(function(g){
    var wrap=document.createElement('div');wrap.className='navgroup';
    var lbl=document.createElement('div');lbl.className='lbl';lbl.textContent=g.name;wrap.appendChild(lbl);
    g.items.forEach(function(d){num++;var b=document.createElement('button');b.className='navitem';b.dataset.i=d.i;
      b.innerHTML='<span class="n">'+String(num).padStart(2,'0')+'</span><span>'+d.title+'</span>';
      b.addEventListener('click',function(){show(d.i);closeNav();});wrap.appendChild(b);});
    nav.appendChild(wrap);
  });

  var content=document.getElementById('content'),heroT=document.getElementById('heroTitle'),
      heroE=document.getElementById('heroEyebrow'),crumb=document.getElementById('crumbTitle');
  function show(i){
    var d=DOCS[i];if(!d)return;
    heroT.textContent=d.title;heroE.textContent=d.group;crumb.textContent=d.title;
    content.innerHTML=render(d.md);
    document.querySelectorAll('.navitem').forEach(function(n){n.classList.toggle('on',+n.dataset.i===i);});
    document.title='Vedrix Docs — '+d.title;
    try{history.replaceState(null,'','#'+d.id);}catch(e){}
    document.querySelector('.main').scrollTop=0;window.scrollTo(0,0);
  }

  /* ---------- nav drawer (mobile) ---------- */
  var app=document.getElementById('app');
  function closeNav(){app.classList.remove('nav-open');}
  document.getElementById('menuBtn').addEventListener('click',function(){app.classList.toggle('nav-open');});
  document.getElementById('scrim').addEventListener('click',closeNav);

  /* ---------- theme ---------- */
  var SUN='<path d="M12 3v2M12 19v2M5 5l1.5 1.5M17.5 17.5L19 19M3 12h2M19 12h2M5 19l1.5-1.5M17.5 6.5L19 5"/><circle cx="12" cy="12" r="4"/>',
      MOON='<path d="M21 12.8A8 8 0 1 1 11.2 3 6.3 6.3 0 0 0 21 12.8z"/>';
  var themeIcon=document.getElementById('themeIcon'),themeLbl=document.getElementById('themeLbl');
  function curDark(){var t=document.documentElement.getAttribute('data-theme');
    if(t)return t==='dark';return window.matchMedia('(prefers-color-scheme:dark)').matches;}
  function paintToggle(){var d=curDark();themeIcon.innerHTML=d?SUN:MOON;themeLbl.textContent=d?'Light':'Dark';}
  document.getElementById('themeBtn').addEventListener('click',function(){
    var d=!curDark();document.documentElement.setAttribute('data-theme',d?'dark':'light');
    try{localStorage.setItem('vedrix-docs-theme',d?'dark':'light');}catch(e){}paintToggle();});
  try{var sv=localStorage.getItem('vedrix-docs-theme');if(sv)document.documentElement.setAttribute('data-theme',sv);}catch(e){}
  paintToggle();
  window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',paintToggle);

  /* ---------- initial ---------- */
  var start=0,hash=(location.hash||'').replace('#','');
  if(hash){DOCS.forEach(function(d,idx){if(d.id===hash)start=idx;});}
  show(start);
})();
</script>
