name: Release

# Builds signed installers for every platform on a version tag (v*), and
# uploads them to a GitHub Release. Push a tag like `v1.0.0` to trigger.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest      # Intel
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux-only system deps for the webview + bundler
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm ci || npm install

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: builds are UNSIGNED for now (users get an "unidentified
          # developer" warning). To enable macOS signing + notarization, add the
          # repo secrets and re-introduce these env vars — but ONLY once the
          # secrets exist, because tauri-action tries to import the certificate
          # whenever APPLE_CERTIFICATE is present (even if empty), which fails:
          #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
          #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
          #   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Vedrix ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install Vedrix.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
